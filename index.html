<title>Sztandary Popiołu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Jeden ciemny wygląd: zgniłe oliwki, brązy, rdza i kość. */
:root{
  --bg:#0a0908; --panel:#1a1612; --panel2:#2a241d; --edge:#4a4236; --edge2:#2e2820;
  --text:#d8cfb8; --muted:#8b8272; --gold:#b8933a; --red:#a3463a; --blood:#5e1716; --moss:#6b6b3e; --purple:#8a64a6;
  --px:"Pixelify Sans","Courier New",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.35 var(--px);overflow:hidden;display:grid;place-items:center;user-select:none}
#wrap{position:relative;--s:2;max-width:100%;max-height:100%;overflow:hidden}
#game{width:100%;height:100%;display:block;image-rendering:pixelated;cursor:crosshair;background:#000}
.hud{position:absolute;pointer-events:none;font-size:clamp(11px,calc(var(--s)*4.4px),17px);text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000}
.frame{background:linear-gradient(#2a241d,#16130f);border:2px solid #0a0908;box-shadow:inset 0 0 0 1px var(--edge),0 2px 0 #000;padding:.35em .6em}
.bar{height:.6em;background:#0a0908;border:1px solid var(--edge2);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;display:block}
.bar b{position:absolute;right:.3em;top:50%;transform:translateY(-50%);font-size:.7em;font-weight:400;color:var(--text);line-height:1}
.bar.tall{height:.95em}
#hp-fill{background:linear-gradient(#9a3a2e,#5e1716)}
#hp-fill.low{background:linear-gradient(#c84a36,#8a2a20);animation:pulse .6s infinite alternate}
@keyframes pulse{to{filter:brightness(1.5)}}
@media (prefers-reduced-motion:reduce){#hp-fill.low{animation:none}}
#st-fill{background:linear-gradient(#a8873a,#6a5423)}
#horse-fill{background:linear-gradient(#6e5841,#4f3d2e)}
.res-faith i{background:linear-gradient(#c8a447,#7d6326)}.res-mana i{background:linear-gradient(#8a64a6,#462750)}.res-fury i{background:linear-gradient(#b14a32,#5e1716)}
.bar.xp i{background:linear-gradient(#a8873a,#6a5423)}
.lbl{display:flex;justify-content:space-between;font-size:.8em;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:.5em;margin:.12em 0}
.muted{color:var(--muted)}.gold{color:var(--gold)}.bad{color:#c35a48}.foe{color:var(--purple)}.ally{color:#c35a48}
.key{display:inline-block;min-width:1.2em;text-align:center;border:1px solid var(--edge);background:#0a0908;margin-right:.4em;color:var(--text);font-size:.9em}
#tl{left:.6em;top:.6em;width:15em;display:grid;gap:.25em}
#tr{right:.6em;top:.6em;display:grid;gap:.15em;text-align:right;min-width:9em}
#bl{left:.6em;bottom:.6em;display:grid;gap:.2em;max-width:52%}
.grp{opacity:.7}.grp.sel{opacity:1;color:var(--gold)}.gname{font-weight:600}
.mbar{display:inline-block;width:3.2em;height:.4em;background:#0a0908;border:1px solid var(--edge2);margin-left:.5em;vertical-align:middle;position:relative}
.mbar i{position:absolute;inset:0 auto 0 0;background:#6b6b3e}.mbar i.warn{background:#a8873a}.mbar i.bad{background:#a3463a}
#log{right:.6em;bottom:4.2em;text-align:right;display:grid;gap:.1em;max-width:42%}
#log .big{font-size:1.2em;font-weight:600}#log .cnt{color:var(--muted);font-size:.85em}
#banner{left:0;right:0;top:20%;text-align:center;font-size:clamp(20px,calc(var(--s)*11px),46px);font-weight:700;letter-spacing:.04em}
#slow{left:0;right:0;top:1.9em;text-align:center;color:var(--purple)}
#build{left:50%;transform:translateX(-50%);top:.15em;color:var(--muted);font-size:clamp(9px,calc(var(--s)*3.3px),12px);opacity:.7;z-index:30}
#abil{left:50%;transform:translateX(-50%);bottom:.6em;display:flex;gap:.3em}
.ab{position:relative;width:6.4em;padding:.2em .3em;background:linear-gradient(#2a241d,#16130f);border:2px solid #0a0908;box-shadow:inset 0 0 0 1px var(--edge);display:grid;font-size:.8em;line-height:1.15;overflow:hidden}
.ab .an{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ab .ac{color:var(--muted);font-size:.85em}
.ab.ready.res-faith{box-shadow:inset 0 0 0 1px var(--gold)}.ab.ready.res-mana{box-shadow:inset 0 0 0 1px var(--purple)}.ab.ready.res-fury,.ab.ready.res-blood{box-shadow:inset 0 0 0 1px var(--red)}
.ab.off{opacity:.55}.ab.empty{opacity:.35}
.ab .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(10,9,8,.7)}.ab .cdt{position:absolute;right:.3em;top:.1em;color:var(--text)}
#cmd{left:50%;bottom:.6em;transform:translateX(-50%);pointer-events:auto;min-width:16em;display:grid;gap:.15em;z-index:5}
#cmd .head{color:var(--gold);display:flex;justify-content:space-between;gap:1em;border-bottom:1px solid var(--edge);padding-bottom:.2em;margin-bottom:.15em}
#cmd .crumb{color:var(--muted)}
#cmd button{all:unset;cursor:pointer;display:flex;gap:.5em;align-items:center;padding:.05em .3em;color:var(--text)}
#cmd button:hover{background:#3d352a}#cmd button.on{color:var(--gold)}#cmd button.dim{color:var(--muted)}
#cmd .foot{color:var(--muted);font-size:.85em;border-top:1px solid var(--edge);padding-top:.2em;margin-top:.15em}

/* mapa */
#maphud{position:absolute;inset:0;pointer-events:none;font-size:clamp(10px,calc(var(--s)*4px),15px);text-shadow:0 1px 0 #000,1px 0 0 #000}
#mh-top{position:absolute;left:.5em;right:.5em;top:.4em;display:flex;flex-wrap:wrap;gap:.3em 1.1em;padding:.25em .6em}
#maphud>*{zoom:var(--uis,1)}
#mh-btns{position:absolute;right:.5em;bottom:.5em;display:flex;gap:.25em;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
#mh-speed{position:absolute;left:.5em;bottom:.5em;display:flex;gap:.25em;pointer-events:auto}
#toasts{position:absolute;left:.6em;top:3.2em;display:grid;gap:.15em;max-width:55%;pointer-events:none;z-index:9}
.toast{transition:opacity 1s;font-size:.95em}.toast.out{opacity:0}
#tip{position:absolute;pointer-events:none;max-width:18em;font-size:.9em;z-index:20}

/* przyciski */
button{font:600 1.05em var(--px);color:#0a0908;background:var(--gold);border:2px solid #0a0908;box-shadow:inset 0 -3px 0 #6a5423,0 2px 0 #000;padding:.3em 1em;cursor:pointer}
button:hover{background:#cfa64a}
button:disabled{opacity:.4;cursor:default;filter:grayscale(.6)}
button:focus-visible{outline:2px dashed var(--text);outline-offset:3px}
button.alt{background:#3d352a;color:var(--text);box-shadow:inset 0 -3px 0 #221d18,0 2px 0 #000}
button.alt:hover{background:#574b3c}
button.danger{background:#5e1716;color:var(--text);box-shadow:inset 0 -3px 0 #360c0b,0 2px 0 #000}
button.mini{font-size:.8em;padding:.08em .5em;margin:.05em .1em;background:#3d352a;color:var(--text);box-shadow:inset 0 -2px 0 #221d18,0 1px 0 #000;border-width:1px}
button.mini:hover{background:#574b3c}button.mini.on{background:var(--gold);color:#0a0908}
button.mini.danger{background:#5e1716}
button.chip{font-size:.85em;padding:.15em .6em;background:#2a241d;color:var(--text);box-shadow:inset 0 -2px 0 #16130f;margin:.1em}
button.chip.on{background:var(--gold);color:#0a0908}
button.tab{font-size:.85em;padding:.2em .6em;background:#221d18;color:var(--text);box-shadow:inset 0 -2px 0 #0a0908}
button.tab.on{background:var(--gold);color:#0a0908}
.btns{display:flex;gap:.5em;flex-wrap:wrap;margin-top:.8em}
.col-btns{display:grid;gap:.4em;margin:.8em 0}
.chips{display:flex;flex-wrap:wrap}

/* okna */
#ui{position:absolute;inset:0;pointer-events:none;z-index:10}
.win>*{zoom:var(--uis,1)}
.win{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,9,8,.62);padding:.8em;overflow:auto;pointer-events:auto;font-size:clamp(11px,calc(var(--s)*3.9px),15px)}
.win.title{background:transparent}
.card{width:100%;max-width:46em;max-height:100%;overflow:auto}
.card.wide{max-width:60em}.card.small{max-width:24em}
h1{font-size:1.9em;margin:0 0 .2em;line-height:1;color:var(--gold);letter-spacing:.03em}
h2{font-size:1em;margin:.8em 0 .3em;color:#c35a48;text-transform:uppercase;letter-spacing:.08em}
p{margin:.35em 0}
.tip{color:var(--muted);font-size:.9em}
.badge{display:inline-block;border:1px solid var(--edge);padding:0 .4em;color:var(--muted);font-size:.85em}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 1.4em}
@media (max-width:700px){.cols{grid-template-columns:1fr}}
.title-card{max-width:30em;width:100%;text-align:center}
.title-card h1{font-size:2.8em;margin-top:.2em}
.title-card .col-btns{max-width:16em;margin:1em auto}
.menu{display:grid;gap:.5em;margin-top:.6em}
.menu label{display:flex;gap:.6em;align-items:center;cursor:pointer}
input[type=checkbox]{accent-color:#b8933a;width:1.1em;height:1.1em}
input[type=range]{accent-color:#b8933a}
input,select{font:inherit;color:var(--text);background:#0a0908;border:1px solid var(--edge);padding:.15em .4em}
input.num{width:5em}
.field{display:grid;gap:.2em;margin:.5em 0}
.tbl{border-collapse:collapse;width:100%;font-size:.92em}
.tbl td,.tbl th{padding:.18em .35em;border-bottom:1px solid var(--edge2);text-align:left;vertical-align:middle}
.tbl th{color:var(--muted);font-weight:400}
.ub{display:inline-block;width:1.2em;text-align:center;font-size:.75em;border:1px solid var(--edge);margin-right:.2em}
.ub.inf{color:#c35a48}.ub.rng{color:#8b8b52}.ub.cav{color:var(--gold)}.ub.spc{color:var(--purple)}
.t1{color:var(--text)}.t2{color:#a8b07a}.t3{color:var(--gold)}
.pic canvas,.portrait canvas,.sprite canvas,.scene-img canvas{image-rendering:pixelated;display:block}
.portrait canvas{width:calc(var(--s)*20px);height:calc(var(--s)*20px);border:2px solid #0a0908;box-shadow:0 0 0 1px var(--edge)}
.portrait.big canvas{width:calc(var(--s)*34px);height:calc(var(--s)*34px)}
.sprite canvas{width:calc(var(--s)*24px);height:calc(var(--s)*32px)}
.scene-img canvas{width:100%;height:auto;border:2px solid #0a0908;box-shadow:0 0 0 1px var(--edge)}
.creator{max-width:52em;width:100%;max-height:100%;overflow:auto}
.cre-grid{display:grid;grid-template-columns:auto 1fr;gap:1.2em}
.cre-left{display:grid;justify-items:center;gap:.4em;align-content:start}
.looks{width:100%}
@media (max-width:640px){.cre-grid{grid-template-columns:1fr}}
.settle{width:100%;max-width:58em;max-height:100%;overflow:auto;display:grid;gap:.4em;background:linear-gradient(#2a241d,#16130f);border:2px solid #0a0908;box-shadow:inset 0 0 0 1px var(--edge);padding:.5em}
.s-head{display:flex;flex-wrap:wrap;gap:.2em 1em;align-items:baseline}
.s-head h1{margin:0}
.s-tabs{display:flex;flex-wrap:wrap;gap:.25em}
.settle .scene.small .scene-img canvas{height:clamp(4em,16vh,9em);width:100%;object-fit:cover;object-position:center 70%}
.s-pane{min-height:6em}
.s-foot{display:flex;gap:1.2em;color:var(--muted);border-top:1px solid var(--edge2);padding-top:.25em}
.dialog{max-width:36em;width:100%;max-height:100%;overflow:auto}
.meet-top{display:flex;gap:.8em;align-items:center}
.comp{display:flex;gap:.6em;align-items:flex-start;margin:.4em 0}
.abl{margin:.35em 0;padding:.25em 0;border-bottom:1px solid var(--edge2)}
.char-top{display:flex;gap:1em;align-items:center}
.char-top>div{flex:1}
.inv{display:grid;grid-template-columns:auto 1fr 1fr;gap:1em}
@media (max-width:720px){.inv{grid-template-columns:1fr}}
.doll{display:grid;justify-items:center;gap:.4em;align-content:start}
.slot{display:flex;justify-content:space-between;align-items:center;gap:.5em;padding:.2em 0;border-bottom:1px solid var(--edge2)}
.slot>span:first-child{min-width:5em}
.chron{max-height:60vh;overflow:auto}
.lords{display:grid;grid-template-columns:repeat(auto-fill,minmax(16em,1fr));gap:.15em .8em;font-size:.9em}
.sw{display:inline-block;width:.7em;height:.7em;margin-right:.4em;border:1px solid #000;vertical-align:middle}
.after{max-width:56em}

/* ---- B5: ikony, dialogi, drzewka, armia ---- */
.ic{image-rendering:pixelated;width:1.15em;height:1.15em;vertical-align:-.2em;display:inline-block}
.ic.big{width:2.2em;height:2.2em}
.mbtn{font-size:.85em;padding:.2em .55em;background:linear-gradient(#3d352a,#221d18);color:var(--text);box-shadow:inset 0 0 0 1px var(--edge),0 2px 0 #000;display:flex;align-items:center;gap:.35em}
.mbtn:hover{background:linear-gradient(#574b3c,#2a241d)}
kbd{font:inherit;font-size:.8em;color:var(--gold);border:1px solid var(--edge);padding:0 .25em;background:#0a0908}
.mi .ic{width:1.3em;height:1.3em}
.hb{display:inline-flex;align-items:center;gap:.3em}
.minibar{display:inline-block;width:3.5em;height:.45em;background:#0a0908;border:1px solid var(--edge2);position:relative}
.minibar i{position:absolute;inset:0 auto 0 0;background:#9a3a2e}
.pulse{animation:pulse .8s infinite alternate}
.s-tabs .tab{display:inline-flex;align-items:center;gap:.3em}
/* dialog */
.dlg{display:grid;gap:.5em}
.dlg-row{display:grid;grid-template-columns:auto 1fr auto;gap:.8em;align-items:start}
.dlg-name{margin-bottom:.3em;font-size:1.15em}
.bubble{position:relative;background:#0f0d0a;border:2px solid var(--edge);padding:.5em .7em;min-height:3.2em;font-size:1.05em;line-height:1.4;cursor:pointer}
.bubble::before{content:"";position:absolute;right:-10px;top:1em;border:8px solid transparent;border-left-color:var(--edge)}
.dlg-info{margin-top:.4em}
.choices{list-style:none;margin:.2em 0 0;padding:0;display:grid;gap:.25em}
button.choice{all:unset;cursor:pointer;display:flex;align-items:center;gap:.5em;width:100%;box-sizing:border-box;padding:.3em .6em;background:linear-gradient(90deg,#2a241d,#16130f);border-left:3px solid var(--edge);color:var(--text)}
button.choice:hover,button.choice:focus-visible{border-left-color:var(--gold);background:linear-gradient(90deg,#3d352a,#1a1612);color:#f0e6cc}
button.choice.danger{border-left-color:#7a2a22}
button.choice:disabled{opacity:.4;cursor:default}
.comp-row{display:flex;flex-wrap:wrap;gap:.3em}
.tchip{display:inline-flex;flex-direction:column;align-items:center;background:#0f0d0a;border:1px solid var(--edge2);padding:.1em .25em;min-width:2.6em}
.tchip b{font-size:.85em}.tchip small{font-size:.7em;color:var(--muted);max-width:6em;text-align:center}
.pow{display:flex;align-items:center;gap:.5em;margin:.4em 0 .1em;font-size:.9em}
.powbar{flex:1;height:.7em;background:#5e1716;border:1px solid #0a0908;position:relative}
.powbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#b8933a,#6a5423)}
.pow.rel .powbar{background:linear-gradient(90deg,#5e1716,#3d352a)}
.pow.rel .powbar i{background:transparent;border-right:3px solid var(--gold)}
/* jednostki */
.uthumb canvas{width:calc(var(--s)*16px);height:calc(var(--s)*20px);image-rendering:pixelated;display:block}
.uthumb[style] canvas{width:calc(var(--w) * var(--s) / 2);height:auto}
.uanim{image-rendering:pixelated;background-repeat:no-repeat;animation:walk .6s steps(4) infinite;flex:none}
@keyframes walk{to{background-position:var(--sw) 0}}
@media (prefers-reduced-motion:reduce){.uanim{animation:none}}
.stars{color:var(--gold);font-size:.8em;letter-spacing:-.05em}
.pgrid{display:grid;grid-template-columns:minmax(12em,1fr) 2fr;gap:.8em}
@media (max-width:720px){.pgrid{grid-template-columns:1fr}}
.ulist{display:grid;gap:.2em;align-content:start;max-height:60vh;overflow:auto}
button.urow{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto auto;gap:.4em;align-items:center;padding:.15em .4em;background:#16130f;border:1px solid var(--edge2)}
button.urow:hover{background:#2a241d}button.urow.on{border-color:var(--gold);background:#2a241d}
.urow .un{display:grid;line-height:1.1}.urow .uc{font-weight:600}.urow .uc i{font-style:normal;margin-left:.3em;font-size:.85em}
.upok{color:var(--gold);font-size:.85em}
.udet{background:#0f0d0a;border:1px solid var(--edge2);padding:.5em .7em;max-height:62vh;overflow:auto}
.udet-top{display:flex;gap:.6em;align-items:flex-start}
.udet-top h2{margin:.1em 0}
.ustats{display:grid;gap:.15em;margin:.4em 0}
.stat{display:grid;grid-template-columns:5.5em 1fr 2.5em;gap:.4em;align-items:center;font-size:.9em}
.stat b{text-align:right}
.s-hp i{background:#9a3a2e}.s-arm i{background:#92969c}.s-atk i{background:#b14a32}.s-def i{background:#6b6b3e}.s-spd i{background:#a8873a}.s-bow i{background:#8b8b52}
.hpb i{background:#9a3a2e}
.ups{display:grid;gap:.4em}
.upc{display:flex;gap:.5em;align-items:center;background:#16130f;border:1px solid var(--edge2);padding:.3em}
.utree{overflow:auto;padding:.3em 0}
.tn{display:flex;align-items:center}
.tch{display:flex;flex-direction:column;gap:.2em;margin-left:.8em;padding-left:.6em;border-left:1px solid var(--edge)}
.tch>.tn::before{content:"";width:.6em;border-top:1px solid var(--edge);margin-left:-.6em}
.tbox{display:flex;flex-direction:column;align-items:center;min-width:5.5em;padding:.15em .3em;background:#16130f;border:1px solid var(--edge2);font-size:.75em;text-align:center;cursor:default}
.tbox[data-a]{cursor:pointer}
.tbox.cur{border-color:var(--gold);background:#2a241d}
/* postać */
.char-grid{display:grid;grid-template-columns:minmax(15em,1fr) 2fr;gap:1em}
@media (max-width:760px){.char-grid{grid-template-columns:1fr}}
.attr{display:grid;grid-template-columns:6.5em 1fr 1.8em auto;gap:.4em;align-items:center;margin:.15em 0}
.attr .an{font-weight:600}
.cre-attrs{margin:.4em 0}
.aslot{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:.4em;padding:.25em .4em;margin:.2em 0;background:#16130f;border:1px solid var(--edge2)}
.aslot .key{grid-row:span 2;align-self:center}
.aslot.res-faith{border-color:#7d6326}.aslot.res-mana{border-color:#462750}.aslot.res-fury,.aslot.res-blood{border-color:#5e1716}
.learned{display:flex;flex-wrap:wrap;gap:.25em;margin-top:.3em}
.lchip{display:flex;align-items:center;gap:.2em;background:#0f0d0a;border:1px solid var(--edge2);padding:.05em .3em;font-size:.85em}
.ttabs{display:flex;flex-wrap:wrap;gap:.2em}
button.ttab{all:unset;cursor:pointer;display:flex;align-items:center;gap:.3em;padding:.2em .45em;background:#16130f;border:1px solid var(--edge2);font-size:.85em}
button.ttab small{color:var(--muted)}
button.ttab.on{border-color:var(--gold);background:#2a241d}
button.ttab.blocked{opacity:.4}
.thead{display:flex;gap:.6em;align-items:baseline;margin:.4em 0;flex-wrap:wrap}
.thead .pts{margin-left:auto}
.tview{position:relative;height:clamp(14em,46vh,24em);background:radial-gradient(#1f1a14,#0f0d0a);border:1px solid var(--edge2)}
.tview svg{position:absolute;inset:0;width:100%;height:100%}
.tview line{stroke:#3d352a;stroke-width:3}.tview line.lit{stroke:#b8933a}.tview line.excl{stroke:#7a2a22;stroke-dasharray:6 5}
button.node{all:unset;cursor:pointer;position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.1em;width:7em;text-align:center;font-size:.8em;line-height:1.1}
button.node .ic{padding:.25em;background:#16130f;border:2px solid #3d352a;box-shadow:0 2px 0 #000}
button.node.have .ic{border-color:var(--gold);background:#3d352a}
button.node.open .ic{border-color:#8b8b52;animation:pulse .9s infinite alternate}
button.node.locked{opacity:.55}
button.node.blocked{opacity:.3;filter:grayscale(1)}
button.node.sel .ic{outline:2px solid #ded7c6;outline-offset:2px}
.abmark{font-style:normal;font-size:.75em;color:var(--purple)}
.ninfo{margin-top:.4em;padding:.3em .5em;background:#0f0d0a;border:1px solid var(--edge2);min-height:4em}
.ninfo h2{margin:.1em 0 .2em}
.phead{display:flex;gap:1em;align-items:baseline;flex-wrap:wrap}
.comp.big{align-items:center}
.settings{max-width:34em}
.opts{display:grid;gap:.45em;margin-top:.6em;min-height:12em}
.opt{display:flex;align-items:center;gap:.7em;cursor:pointer;justify-content:space-between;padding:.25em .4em;background:#16130f;border:1px solid var(--edge2)}
label.opt:has(input[type=checkbox]){justify-content:flex-start}
.opt small{display:block;color:var(--muted);font-size:.8em}
.opt input[type=range]{flex:1;max-width:12em}
.quest{display:flex;gap:.6em;align-items:flex-start;padding:.4em;margin:.3em 0;background:#16130f;border-left:3px solid #e9c45e}
.arow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 8px;border-bottom:1px solid #3a2e22}
.arow:hover{background:#2a2119}
.bracket{display:flex;gap:14px;align-items:stretch;margin:10px 0}
.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:6px;flex:1}
.bk{border:1px solid #6b5234;background:#1c1610;padding:4px 8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk.you{border-color:#e9c45e;color:#e9c45e}.bk.out{opacity:.4;text-decoration:line-through}.bk.empty{color:#665;text-align:center}
.advbar{height:.5em;background:#7a2a20;border:1px solid #000;position:relative}.advbar i{position:absolute;left:0;top:0;bottom:0;background:#5d9a46;transition:width .4s}
#mini{pointer-events:auto;cursor:zoom-in;display:block;margin-top:.3em;border:1px solid rgba(0,0,0,.6);width:7.5em;margin-left:auto;opacity:.78;background:rgba(20,22,14,.35)}
#mini.big{position:fixed;right:1.2%;top:16%;width:min(34vw,400px);z-index:4;opacity:.96;box-shadow:0 0 0 2px #6b5234;pointer-events:auto;cursor:crosshair}
.grp .ic{width:1.1em;height:1.1em;vertical-align:-.15em;margin-right:.25em}
#abil .ab{min-width:6.5em;min-height:3.4em}#abil .ab .ic{width:1.6em;height:1.6em;display:block;margin:0 auto .1em}
.casl{display:grid;grid-template-columns:repeat(auto-fill,minmax(11em,1fr));gap:.3em}
.cas{display:flex;gap:.4em;align-items:center;background:#1c1610;border:1px solid #3a2e22;padding:.2em .4em;font-size:.9em}.cas canvas{width:28px;height:auto}
.cas.promo{border-color:#8a6d2a}
.astats{display:flex;gap:.6em;margin:.4em 0 .6em}.astats>div{flex:1;background:#1c1610;border:1px solid #3a2e22;text-align:center;padding:.3em}.astats b{display:block;font-size:1.5em;color:var(--gold)}.astats span{color:var(--muted);font-size:.8em}.astats .ic{width:1.5em;height:1.5em}
.chart{background:#1c1610;border:1px solid #3a2e22;padding:.3em}.chart svg{width:100%;height:70px;display:block}.chart .ca{stroke:#7fbf5a;fill:none;stroke-width:2}.chart .cb{stroke:#d0503c;fill:none;stroke-width:2}.chl{font-size:.8em}
.cas.best{border-color:#e9c45e;height:100%}.cas.best canvas{width:40px}
.cas.loot{cursor:pointer}.cas.loot input{margin:0 .2em 0 0}.cas.loot:has(input:not(:checked)){opacity:.45}
p.rel{color:#e9c45e}
#startfight{position:absolute;left:50%;top:4.2em;transform:translateX(-50%);pointer-events:auto;z-index:6;font-size:1.1em;padding:.4em 1.2em}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5em,1fr));gap:.4em;margin:.4em 0}
.acard{display:flex;flex-direction:column;gap:.15em;background:#1c1610;border:1px solid #3a2e22;padding:.4em;font-size:.9em}.acard:hover{border-color:#8a6d2a}
.apic{height:42px;display:flex;justify-content:center;align-items:flex-end;gap:2px;background:linear-gradient(#2a2119,#3b2e1d)}.apic canvas{height:38px;width:auto}
.bracket.b16 .bk{font-size:11px;padding:2px 5px}.bk.lord{border-color:#a78a3a}
.minitog{all:unset;pointer-events:auto;cursor:pointer;font-size:.75em;color:var(--muted);display:block;text-align:right;margin-top:.1em}.minitog:hover{color:var(--gold)}
#mini.big+.minitog{position:fixed;right:1.4%;top:calc(16% - 1.4em);z-index:5;color:var(--gold)}
.acard.cool{opacity:.5}
</style>

<div id="wrap">
  <canvas id="game" width="480" height="270"></canvas>

  <div id="bhud" hidden>
    <div class="hud frame" id="tl">
      <div class="row"><span id="hero-name">Bohater</span><span class="muted" id="weapon"></span></div>
      <div class="bar tall"><i id="hp-fill" style="width:100%"></i><b id="hp-txt"></b></div>
      <div class="lbl"><span>Wytrzymałość</span></div>
      <div class="bar"><i id="st-fill" style="width:100%"></i></div>
      <div id="horse-row" hidden><div class="lbl"><span>Koń</span></div><div class="bar"><i id="horse-fill" style="width:100%"></i></div></div>
      <div id="res"></div>
      <div class="muted" id="dir"></div>
    </div>
    <div class="hud frame" id="tr">
      <div><span class="ally">Twoi</span> <b id="ours">0</b></div>
      <div><span class="foe" id="foe-name">Wróg</span> <b id="foes">0</b></div>
      <div class="advbar"><i id="adv" style="width:50%"></i></div><div class="muted" id="adv-t" style="font-size:.85em"></div>
      <canvas id="mini" width="96" height="64"></canvas>
      <button id="minitog" class="minitog">⤢ mapa (N)</button>
    </div>
    <div class="hud frame" id="bl"><div id="groups"></div></div>
    <div class="hud" id="abil"></div>
    <div class="hud" id="log"></div>
    <div class="hud" id="banner" hidden></div>
    <div class="hud" id="slow" hidden></div>
    <button id="startfight" hidden>Do boju! <kbd>Enter</kbd></button>
  </div>
  <div class="hud frame" id="cmd" hidden></div>

  <div id="maphud" hidden>
    <div class="frame" id="mh-top"></div>
    <div id="mh-speed"></div>
    <div id="mh-btns">
      <button class="mbtn" data-win="char"><span class="mi" data-ic="star"></span>Postać <kbd>C</kbd></button>
      <button class="mbtn" data-win="inv"><span class="mi" data-ic="shield"></span>Ekwipunek <kbd>I</kbd></button>
      <button class="mbtn" data-win="party"><span class="mi" data-ic="man"></span>Armia <kbd>P</kbd></button>
      <button class="mbtn" data-win="fac"><span class="mi" data-ic="banner"></span>Frakcje <kbd>F</kbd></button>
      <button class="mbtn" data-win="chron"><span class="mi" data-ic="scroll"></span>Kronika <kbd>K</kbd></button>
      <button class="mbtn" data-win="quest"><span class="mi" data-ic="eye"></span>Zadania <kbd>J</kbd></button>
    </div>
    <div class="frame" id="tip" hidden></div>
  </div>

  <div id="ui"></div>
  <div class="hud" id="toasts"></div>
  <div class="hud" id="build"></div>
</div>
<script>/*__GAME__*/</script>
