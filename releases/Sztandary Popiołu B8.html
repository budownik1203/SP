<title>Sztandary Popiołu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Jeden ciemny wygląd: zgniłe oliwki, brązy, rdza i kość. */
:root{
  --bg:#0a0908; --panel:#1a1612; --panel2:#2a241d; --edge:#4a4236; --edge2:#2e2820;
  --text:#d8cfb8; --muted:#8b8272; --gold:#b8933a; --red:#a3463a; --blood:#5e1716; --moss:#6b6b3e; --purple:#8a64a6;
  --px:"Pixelify Sans","Courier New",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.35 var(--px);overflow:hidden;display:grid;place-items:center;user-select:none}
#wrap{position:relative;--s:2;max-width:100%;max-height:100%;overflow:hidden}
#game{width:100%;height:100%;display:block;image-rendering:pixelated;cursor:crosshair;background:#000}
.hud{position:absolute;pointer-events:none;font-size:clamp(11px,calc(var(--s)*4.4px),17px);text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000}
.frame{background:linear-gradient(#2a241d,#16130f);border:2px solid #0a0908;box-shadow:inset 0 0 0 1px var(--edge),0 2px 0 #000;padding:.35em .6em}
.bar{height:.6em;background:#0a0908;border:1px solid var(--edge2);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;display:block}
.bar b{position:absolute;right:.3em;top:50%;transform:translateY(-50%);font-size:.7em;font-weight:400;color:var(--text);line-height:1}
.bar.tall{height:.95em}
#hp-fill{background:linear-gradient(#9a3a2e,#5e1716)}
#hp-fill.low{background:linear-gradient(#c84a36,#8a2a20);animation:pulse .6s infinite alternate}
@keyframes pulse{to{filter:brightness(1.5)}}
@media (prefers-reduced-motion:reduce){#hp-fill.low{animation:none}}
#st-fill{background:linear-gradient(#a8873a,#6a5423)}
#horse-fill{background:linear-gradient(#6e5841,#4f3d2e)}
.res-faith i{background:linear-gradient(#c8a447,#7d6326)}.res-mana i{background:linear-gradient(#8a64a6,#462750)}.res-fury i{background:linear-gradient(#b14a32,#5e1716)}
.bar.xp i{background:linear-gradient(#a8873a,#6a5423)}
.lbl{display:flex;justify-content:space-between;font-size:.8em;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:.5em;margin:.12em 0}
.muted{color:var(--muted)}.gold{color:var(--gold)}.bad{color:#c35a48}.foe{color:var(--purple)}.ally{color:#c35a48}
.key{display:inline-block;min-width:1.2em;text-align:center;border:1px solid var(--edge);background:#0a0908;margin-right:.4em;color:var(--text);font-size:.9em}
#tl{left:.6em;top:.6em;width:15em;display:grid;gap:.25em}
#tr{right:.6em;top:.6em;display:grid;gap:.15em;text-align:right;min-width:9em}
#bl{left:.6em;bottom:.6em;display:grid;gap:.2em;max-width:52%}
.grp{opacity:.7}.grp.sel{opacity:1;color:var(--gold)}.gname{font-weight:600}
.mbar{display:inline-block;width:3.2em;height:.4em;background:#0a0908;border:1px solid var(--edge2);margin-left:.5em;vertical-align:middle;position:relative}
.mbar i{position:absolute;inset:0 auto 0 0;background:#6b6b3e}.mbar i.warn{background:#a8873a}.mbar i.bad{background:#a3463a}
#log{right:.6em;bottom:4.2em;text-align:right;display:grid;gap:.1em;max-width:42%}
#log .big{font-size:1.2em;font-weight:600}#log .cnt{color:var(--muted);font-size:.85em}
#banner{left:0;right:0;top:20%;text-align:center;font-size:clamp(20px,calc(var(--s)*11px),46px);font-weight:700;letter-spacing:.04em}
#slow{left:0;right:0;top:1.9em;text-align:center;color:var(--purple)}
#build{left:50%;transform:translateX(-50%);top:.15em;color:var(--muted);font-size:clamp(9px,calc(var(--s)*3.3px),12px);opacity:.7;z-index:30}
#abil{left:50%;transform:translateX(-50%);bottom:.6em;display:flex;gap:.3em}
.ab{position:relative;width:6.4em;padding:.2em .3em;background:linear-gradient(#2a241d,#16130f);border:2px solid #0a0908;box-shadow:inset 0 0 0 1px var(--edge);display:grid;font-size:.8em;line-height:1.15;overflow:hidden}
.ab .an{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ab .ac{color:var(--muted);font-size:.85em}
.ab.ready.res-faith{box-shadow:inset 0 0 0 1px var(--gold)}.ab.ready.res-mana{box-shadow:inset 0 0 0 1px var(--purple)}.ab.ready.res-fury,.ab.ready.res-blood{box-shadow:inset 0 0 0 1px var(--red)}
.ab.off{opacity:.55}.ab.empty{opacity:.35}
.ab .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(10,9,8,.7)}.ab .cdt{position:absolute;right:.3em;top:.1em;color:var(--text)}
#cmd{left:50%;bottom:.6em;transform:translateX(-50%);pointer-events:auto;min-width:16em;display:grid;gap:.15em;z-index:5}
#cmd .head{color:var(--gold);display:flex;justify-content:space-between;gap:1em;border-bottom:1px solid var(--edge);padding-bottom:.2em;margin-bottom:.15em}
#cmd .crumb{color:var(--muted)}
#cmd button{all:unset;cursor:pointer;display:flex;gap:.5em;align-items:center;padding:.05em .3em;color:var(--text)}
#cmd button:hover{background:#3d352a}#cmd button.on{color:var(--gold)}#cmd button.dim{color:var(--muted)}
#cmd .foot{color:var(--muted);font-size:.85em;border-top:1px solid var(--edge);padding-top:.2em;margin-top:.15em}

/* mapa */
#maphud{position:absolute;inset:0;pointer-events:none;font-size:clamp(10px,calc(var(--s)*4px),15px);text-shadow:0 1px 0 #000,1px 0 0 #000}
#mh-top{position:absolute;left:.5em;right:.5em;top:.4em;display:flex;flex-wrap:wrap;gap:.3em 1.1em;padding:.25em .6em}
#maphud>*{zoom:var(--uis,1)}
#mh-btns{position:absolute;right:.5em;bottom:.5em;display:flex;gap:.25em;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
#mh-speed{position:absolute;left:.5em;bottom:.5em;display:flex;gap:.25em;pointer-events:auto}
#toasts{position:absolute;left:.6em;top:3.2em;display:grid;gap:.15em;max-width:55%;pointer-events:none;z-index:9}
.toast{transition:opacity 1s;font-size:.95em}.toast.out{opacity:0}
#tip{position:absolute;pointer-events:none;max-width:18em;font-size:.9em;z-index:20}

/* przyciski */
button{font:600 1.05em var(--px);color:#0a0908;background:var(--gold);border:2px solid #0a0908;box-shadow:inset 0 -3px 0 #6a5423,0 2px 0 #000;padding:.3em 1em;cursor:pointer}
button:hover{background:#cfa64a}
button:disabled{opacity:.4;cursor:default;filter:grayscale(.6)}
button:focus-visible{outline:2px dashed var(--text);outline-offset:3px}
button.alt{background:#3d352a;color:var(--text);box-shadow:inset 0 -3px 0 #221d18,0 2px 0 #000}
button.alt:hover{background:#574b3c}
button.danger{background:#5e1716;color:var(--text);box-shadow:inset 0 -3px 0 #360c0b,0 2px 0 #000}
button.mini{font-size:.8em;padding:.08em .5em;margin:.05em .1em;background:#3d352a;color:var(--text);box-shadow:inset 0 -2px 0 #221d18,0 1px 0 #000;border-width:1px}
button.mini:hover{background:#574b3c}button.mini.on{background:var(--gold);color:#0a0908}
button.mini.danger{background:#5e1716}
button.chip{font-size:.85em;padding:.15em .6em;background:#2a241d;color:var(--text);box-shadow:inset 0 -2px 0 #16130f;margin:.1em}
button.chip.on{background:var(--gold);color:#0a0908}
button.tab{font-size:.85em;padding:.2em .6em;background:#221d18;color:var(--text);box-shadow:inset 0 -2px 0 #0a0908}
button.tab.on{background:var(--gold);color:#0a0908}
.btns{display:flex;gap:.5em;flex-wrap:wrap;margin-top:.8em}
.col-btns{display:grid;gap:.4em;margin:.8em 0}
.chips{display:flex;flex-wrap:wrap}

/* okna */
#ui{position:absolute;inset:0;pointer-events:none;z-index:10}
.win>*{zoom:var(--uis,1)}
.win{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,9,8,.62);padding:.8em;overflow:auto;pointer-events:auto;font-size:clamp(11px,calc(var(--s)*3.9px),15px)}
.win.title{background:transparent}
.card{width:100%;max-width:46em;max-height:100%;overflow:auto}
.card.wide{max-width:60em}.card.small{max-width:24em}
h1{font-size:1.9em;margin:0 0 .2em;line-height:1;color:var(--gold);letter-spacing:.03em}
h2{font-size:1em;margin:.8em 0 .3em;color:#c35a48;text-transform:uppercase;letter-spacing:.08em}
p{margin:.35em 0}
.tip{color:var(--muted);font-size:.9em}
.badge{display:inline-block;border:1px solid var(--edge);padding:0 .4em;color:var(--muted);font-size:.85em}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 1.4em}
@media (max-width:700px){.cols{grid-template-columns:1fr}}
.title-card{max-width:30em;width:100%;text-align:center}
.title-card h1{font-size:2.8em;margin-top:.2em}
.title-card .col-btns{max-width:16em;margin:1em auto}
.menu{display:grid;gap:.5em;margin-top:.6em}
.menu label{display:flex;gap:.6em;align-items:center;cursor:pointer}
input[type=checkbox]{accent-color:#b8933a;width:1.1em;height:1.1em}
input[type=range]{accent-color:#b8933a}
input,select{font:inherit;color:var(--text);background:#0a0908;border:1px solid var(--edge);padding:.15em .4em}
input.num{width:5em}
.field{display:grid;gap:.2em;margin:.5em 0}
.tbl{border-collapse:collapse;width:100%;font-size:.92em}
.tbl td,.tbl th{padding:.18em .35em;border-bottom:1px solid var(--edge2);text-align:left;vertical-align:middle}
.tbl th{color:var(--muted);font-weight:400}
.ub{display:inline-block;width:1.2em;text-align:center;font-size:.75em;border:1px solid var(--edge);margin-right:.2em}
.ub.inf{color:#c35a48}.ub.rng{color:#8b8b52}.ub.cav{color:var(--gold)}.ub.spc{color:var(--purple)}
.t1{color:var(--text)}.t2{color:#a8b07a}.t3{color:var(--gold)}
.pic canvas,.portrait canvas,.sprite canvas,.scene-img canvas{image-rendering:pixelated;display:block}
.portrait canvas{width:calc(var(--s)*20px);height:calc(var(--s)*20px);border:2px solid #0a0908;box-shadow:0 0 0 1px var(--edge)}
.portrait.big canvas{width:calc(var(--s)*34px);height:calc(var(--s)*34px)}
.sprite canvas{width:calc(var(--s)*24px);height:calc(var(--s)*32px)}
.scene-img canvas{width:100%;height:auto;border:2px solid #0a0908;box-shadow:0 0 0 1px var(--edge)}
.creator{max-width:52em;width:100%;max-height:100%;overflow:auto}
.cre-grid{display:grid;grid-template-columns:auto 1fr;gap:1.2em}
.cre-left{display:grid;justify-items:center;gap:.4em;align-content:start}
.looks{width:100%}
@media (max-width:640px){.cre-grid{grid-template-columns:1fr}}
.settle{width:100%;max-width:58em;max-height:100%;overflow:auto;display:grid;gap:.4em;background:linear-gradient(#2a241d,#16130f);border:2px solid #0a0908;box-shadow:inset 0 0 0 1px var(--edge);padding:.5em}
.s-head{display:flex;flex-wrap:wrap;gap:.2em 1em;align-items:baseline}
.s-head h1{margin:0}
.s-tabs{display:flex;flex-wrap:wrap;gap:.25em}
.settle .scene.small .scene-img canvas{height:clamp(4em,16vh,9em);width:100%;object-fit:cover;object-position:center 70%}
.s-pane{min-height:6em}
.s-foot{display:flex;gap:1.2em;color:var(--muted);border-top:1px solid var(--edge2);padding-top:.25em}
.dialog{max-width:36em;width:100%;max-height:100%;overflow:auto}
.meet-top{display:flex;gap:.8em;align-items:center}
.comp{display:flex;gap:.6em;align-items:flex-start;margin:.4em 0}
.abl{margin:.35em 0;padding:.25em 0;border-bottom:1px solid var(--edge2)}
.char-top{display:flex;gap:1em;align-items:center}
.char-top>div{flex:1}
.inv{display:grid;grid-template-columns:auto 1fr 1fr;gap:1em}
@media (max-width:720px){.inv{grid-template-columns:1fr}}
.doll{display:grid;justify-items:center;gap:.4em;align-content:start}
.slot{display:flex;justify-content:space-between;align-items:center;gap:.5em;padding:.2em 0;border-bottom:1px solid var(--edge2)}
.slot>span:first-child{min-width:5em}
.chron{max-height:60vh;overflow:auto}
.lords{display:grid;grid-template-columns:repeat(auto-fill,minmax(16em,1fr));gap:.15em .8em;font-size:.9em}
.sw{display:inline-block;width:.7em;height:.7em;margin-right:.4em;border:1px solid #000;vertical-align:middle}
.after{max-width:44em}

/* ---- B5: ikony, dialogi, drzewka, armia ---- */
.ic{image-rendering:pixelated;width:1.15em;height:1.15em;vertical-align:-.2em;display:inline-block}
.ic.big{width:2.2em;height:2.2em}
.mbtn{font-size:.85em;padding:.2em .55em;background:linear-gradient(#3d352a,#221d18);color:var(--text);box-shadow:inset 0 0 0 1px var(--edge),0 2px 0 #000;display:flex;align-items:center;gap:.35em}
.mbtn:hover{background:linear-gradient(#574b3c,#2a241d)}
kbd{font:inherit;font-size:.8em;color:var(--gold);border:1px solid var(--edge);padding:0 .25em;background:#0a0908}
.mi .ic{width:1.3em;height:1.3em}
.hb{display:inline-flex;align-items:center;gap:.3em}
.minibar{display:inline-block;width:3.5em;height:.45em;background:#0a0908;border:1px solid var(--edge2);position:relative}
.minibar i{position:absolute;inset:0 auto 0 0;background:#9a3a2e}
.pulse{animation:pulse .8s infinite alternate}
.s-tabs .tab{display:inline-flex;align-items:center;gap:.3em}
/* dialog */
.dlg{display:grid;gap:.5em}
.dlg-row{display:grid;grid-template-columns:auto 1fr auto;gap:.8em;align-items:start}
.dlg-name{margin-bottom:.3em;font-size:1.15em}
.bubble{position:relative;background:#0f0d0a;border:2px solid var(--edge);padding:.5em .7em;min-height:3.2em;font-size:1.05em;line-height:1.4;cursor:pointer}
.bubble::before{content:"";position:absolute;right:-10px;top:1em;border:8px solid transparent;border-left-color:var(--edge)}
.dlg-info{margin-top:.4em}
.choices{list-style:none;margin:.2em 0 0;padding:0;display:grid;gap:.25em}
button.choice{all:unset;cursor:pointer;display:flex;align-items:center;gap:.5em;width:100%;box-sizing:border-box;padding:.3em .6em;background:linear-gradient(90deg,#2a241d,#16130f);border-left:3px solid var(--edge);color:var(--text)}
button.choice:hover,button.choice:focus-visible{border-left-color:var(--gold);background:linear-gradient(90deg,#3d352a,#1a1612);color:#f0e6cc}
button.choice.danger{border-left-color:#7a2a22}
button.choice:disabled{opacity:.4;cursor:default}
.comp-row{display:flex;flex-wrap:wrap;gap:.3em}
.tchip{display:inline-flex;flex-direction:column;align-items:center;background:#0f0d0a;border:1px solid var(--edge2);padding:.1em .25em;min-width:2.6em}
.tchip b{font-size:.85em}.tchip small{font-size:.7em;color:var(--muted);max-width:6em;text-align:center}
.pow{display:flex;align-items:center;gap:.5em;margin:.4em 0 .1em;font-size:.9em}
.powbar{flex:1;height:.7em;background:#5e1716;border:1px solid #0a0908;position:relative}
.powbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#b8933a,#6a5423)}
.pow.rel .powbar{background:linear-gradient(90deg,#5e1716,#3d352a)}
.pow.rel .powbar i{background:transparent;border-right:3px solid var(--gold)}
/* jednostki */
.uthumb canvas{width:calc(var(--s)*16px);height:calc(var(--s)*20px);image-rendering:pixelated;display:block}
.uthumb[style] canvas{width:calc(var(--w) * var(--s) / 2);height:auto}
.uanim{image-rendering:pixelated;background-repeat:no-repeat;animation:walk .6s steps(4) infinite;flex:none}
@keyframes walk{to{background-position:var(--sw) 0}}
@media (prefers-reduced-motion:reduce){.uanim{animation:none}}
.stars{color:var(--gold);font-size:.8em;letter-spacing:-.05em}
.pgrid{display:grid;grid-template-columns:minmax(12em,1fr) 2fr;gap:.8em}
@media (max-width:720px){.pgrid{grid-template-columns:1fr}}
.ulist{display:grid;gap:.2em;align-content:start;max-height:60vh;overflow:auto}
button.urow{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto auto;gap:.4em;align-items:center;padding:.15em .4em;background:#16130f;border:1px solid var(--edge2)}
button.urow:hover{background:#2a241d}button.urow.on{border-color:var(--gold);background:#2a241d}
.urow .un{display:grid;line-height:1.1}.urow .uc{font-weight:600}.urow .uc i{font-style:normal;margin-left:.3em;font-size:.85em}
.upok{color:var(--gold);font-size:.85em}
.udet{background:#0f0d0a;border:1px solid var(--edge2);padding:.5em .7em;max-height:62vh;overflow:auto}
.udet-top{display:flex;gap:.6em;align-items:flex-start}
.udet-top h2{margin:.1em 0}
.ustats{display:grid;gap:.15em;margin:.4em 0}
.stat{display:grid;grid-template-columns:5.5em 1fr 2.5em;gap:.4em;align-items:center;font-size:.9em}
.stat b{text-align:right}
.s-hp i{background:#9a3a2e}.s-arm i{background:#92969c}.s-atk i{background:#b14a32}.s-def i{background:#6b6b3e}.s-spd i{background:#a8873a}.s-bow i{background:#8b8b52}
.hpb i{background:#9a3a2e}
.ups{display:grid;gap:.4em}
.upc{display:flex;gap:.5em;align-items:center;background:#16130f;border:1px solid var(--edge2);padding:.3em}
.utree{overflow:auto;padding:.3em 0}
.tn{display:flex;align-items:center}
.tch{display:flex;flex-direction:column;gap:.2em;margin-left:.8em;padding-left:.6em;border-left:1px solid var(--edge)}
.tch>.tn::before{content:"";width:.6em;border-top:1px solid var(--edge);margin-left:-.6em}
.tbox{display:flex;flex-direction:column;align-items:center;min-width:5.5em;padding:.15em .3em;background:#16130f;border:1px solid var(--edge2);font-size:.75em;text-align:center;cursor:default}
.tbox[data-a]{cursor:pointer}
.tbox.cur{border-color:var(--gold);background:#2a241d}
/* postać */
.char-grid{display:grid;grid-template-columns:minmax(15em,1fr) 2fr;gap:1em}
@media (max-width:760px){.char-grid{grid-template-columns:1fr}}
.attr{display:grid;grid-template-columns:6.5em 1fr 1.8em auto;gap:.4em;align-items:center;margin:.15em 0}
.attr .an{font-weight:600}
.cre-attrs{margin:.4em 0}
.aslot{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:.4em;padding:.25em .4em;margin:.2em 0;background:#16130f;border:1px solid var(--edge2)}
.aslot .key{grid-row:span 2;align-self:center}
.aslot.res-faith{border-color:#7d6326}.aslot.res-mana{border-color:#462750}.aslot.res-fury,.aslot.res-blood{border-color:#5e1716}
.learned{display:flex;flex-wrap:wrap;gap:.25em;margin-top:.3em}
.lchip{display:flex;align-items:center;gap:.2em;background:#0f0d0a;border:1px solid var(--edge2);padding:.05em .3em;font-size:.85em}
.ttabs{display:flex;flex-wrap:wrap;gap:.2em}
button.ttab{all:unset;cursor:pointer;display:flex;align-items:center;gap:.3em;padding:.2em .45em;background:#16130f;border:1px solid var(--edge2);font-size:.85em}
button.ttab small{color:var(--muted)}
button.ttab.on{border-color:var(--gold);background:#2a241d}
button.ttab.blocked{opacity:.4}
.thead{display:flex;gap:.6em;align-items:baseline;margin:.4em 0;flex-wrap:wrap}
.thead .pts{margin-left:auto}
.tview{position:relative;height:clamp(14em,46vh,24em);background:radial-gradient(#1f1a14,#0f0d0a);border:1px solid var(--edge2)}
.tview svg{position:absolute;inset:0;width:100%;height:100%}
.tview line{stroke:#3d352a;stroke-width:3}.tview line.lit{stroke:#b8933a}.tview line.excl{stroke:#7a2a22;stroke-dasharray:6 5}
button.node{all:unset;cursor:pointer;position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.1em;width:7em;text-align:center;font-size:.8em;line-height:1.1}
button.node .ic{padding:.25em;background:#16130f;border:2px solid #3d352a;box-shadow:0 2px 0 #000}
button.node.have .ic{border-color:var(--gold);background:#3d352a}
button.node.open .ic{border-color:#8b8b52;animation:pulse .9s infinite alternate}
button.node.locked{opacity:.55}
button.node.blocked{opacity:.3;filter:grayscale(1)}
button.node.sel .ic{outline:2px solid #ded7c6;outline-offset:2px}
.abmark{font-style:normal;font-size:.75em;color:var(--purple)}
.ninfo{margin-top:.4em;padding:.3em .5em;background:#0f0d0a;border:1px solid var(--edge2);min-height:4em}
.ninfo h2{margin:.1em 0 .2em}
.phead{display:flex;gap:1em;align-items:baseline;flex-wrap:wrap}
.comp.big{align-items:center}
.settings{max-width:34em}
.opts{display:grid;gap:.45em;margin-top:.6em;min-height:12em}
.opt{display:flex;align-items:center;gap:.7em;cursor:pointer;justify-content:space-between;padding:.25em .4em;background:#16130f;border:1px solid var(--edge2)}

<script>(function(){

    steelD: "#393b3f", steel: "#5f636a", steelL: "#92969c",

            if (block.includes(e.code))

            this.mx = ((e.clientX - r.left) / r.width) * W;

"use strict";
// Grafika rysowana kodem (Build B4). Postacie 24×32 z warstwami: sylwetka, twarz, hełm, zbroja, tabard, oporządzenie, brud i krew.
// Kierunki: 0 = w dół, 1 = w górę, 2 = w bok (prawo; lewo to odbicie). Klatki: 0–3 chód (0 to też postój).
function mkCanvas(w, h) {

    c.height = h;

function hashInt(n) { n = Math.imul(n ^ 0x45d9f3b, 0x45d9f3b); n ^= n >>> 16; n = Math.imul(n, 0x45d9f3b); n ^= n >>> 16; return n >>> 0; }

// Bufor pikseli z prostymi operacjami. Kolory jako "#rrggbb".
class Pix {

    p(x, y, c) { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < this.w && y < this.h)
        this.px[y * this.w + x] = c; }

        for (let i = 0; i < w; i++)
            this.p(x + i, y + j, c); }
    get(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h ? this.px[y * this.w + x] : null; }
    has(x, y) { return !!this.get(x, y); }
    line(x0, y0, x1, y1, c) {
        x0 = Math.round(x0);
        y0 = Math.round(y0);
        x1 = Math.round(x1);
        y1 = Math.round(y1);
        const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
        let err = dx + dy;

                break;

            if (e2 <= dx) {

        const d = im.data;
        const rgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
        for (let y = 0; y < this.h; y++)
            for (let x = 0; x < this.w; x++) {
                const col = this.px[y * this.w + x];
                if (!col)
                    continue;
                let [r, gg, b] = rgb(col);
                if (shade) {
                    // światło z lewej góry: krawędzie lewa i górna jaśniejsze, prawa i dolna ciemniejsze

                        f = 0.82;

                d[k + 1] = gg;

        return { cx: 12, headTop: 3, headW: 8, headH: 8, top: 11, bot: 22, hw: 6 + (L.build === 2 ? 1 : 0), legW: 4, legGap: 1 };

            for (let x = tx0; x <= tx1; x++) {
                if (y >= ty1 - 1 && vrand(seed, x * 37 + y) < (y === ty1 ? 0.45 : 0.18))
                    continue; // poszarpany brzeg

                        c = T.trim;
                    if (T.pattern === "quarter" && ((x < cx) !== (y < mid)))
                        c = T.trim;
                    if (T.pattern === "chevron" && Math.floor(Math.abs(rx)) === y - ty0 - 1)
                        c = T.trim;
                    if (T.pattern === "cross" && (Math.abs(rx) < 1 || y === ty0 + 3))

            if (L.helm === "crest") {

                P.r(22, 1, 6, 2, PAL.red);
            }
            if (L.helm === "dwarf") {
                P.r(10, 12, 20, 2, PAL.gold);
                P.r(4, 4, 3, 7, PAL.bone);
                P.r(33, 4, 3, 7, PAL.bone);
            }
            if (L.helm === "orc") {
                P.r(13, 0, 2, 3, PAL.steelL);
                P.r(19, 0, 2, 2, PAL.steelL);
                P.r(25, 0, 2, 3, PAL.steelL);

    // ramka w barwach
    for (let i = 0; i < 40; i++) {
        P.p(i, 0, frameCol);

}

// Linia pikselowa (Bresenham) – broń, strzały, łuki.
function pxLine(g, x0, y0, x1, y1, col) {
    x0 = Math.round(x0);
    y0 = Math.round(y0);
    x1 = Math.round(x1);
    y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    g.fillStyle = col;
    for (let i = 0; i < 120; i++) {
        g.fillRect(x0, y0, 1, 1);
        if (x0 === x1 && y0 === y1)
            break;
        const e2 = 2 * err;
        if (e2 >= dy) {
            err += dy;
            x0 += sx;
        }
        if (e2 <= dx) {
            err += dx;
            y0 += sy;
        }
    }
}

"use strict";
// Dźwięk generowany w całości kodem: efekty walki z pogłosem, tło (wiatr, wrony, zgiełk) i muzyka (lutnia i burdon).
class Sfx {
    constructor() {
        this.ctx = null;
        this.last = {};
        this.dinGain = null;
        this.musicOn = true;
        this.intensity = 0;
        this.plucks = new Map();
        this.nextNote = 0;
        this.phrase = [];
        this.noteStep = 0;
        this.crowT = 8;
        this.rainGain = null;
        this.volume = 1;
        this.musicVol = 0.6;
    }
    setMusicVolume(v) { this.musicVol = v; if (this.ctx && this.musicOn)
        this.musicBus.gain.setTargetAtTime(0.5 * v / 0.6, this.ctx.currentTime, 0.2); }
    init() {
        if (this.ctx) {
            if (this.ctx.state === "suspended")
                this.ctx.resume();
            return;
        }
        try {
            const c = new AudioContext();
            this.ctx = c;
            const comp = c.createDynamicsCompressor();
            comp.threshold.value = -14;
            comp.ratio.value = 4;
            this.master = c.createGain();
            this.master.gain.value = 0.8 * this.volume;
            this.master.connect(comp);
            comp.connect(c.destination);
            this.fx = c.createGain();
            this.fx.gain.value = 0.85;
            this.fx.connect(this.master);
            // pogłos: odpowiedź impulsowa z zanikającego szumu
            const conv = c.createConvolver();
            const len = Math.floor(c.sampleRate * 1.7);
            const ir = c.createBuffer(2, len, c.sampleRate);
            for (let ch = 0; ch < 2; ch++) {
                const d = ir.getChannelData(ch);
                for (let i = 0; i < len; i++)
                    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
            }
            conv.buffer = ir;
            this.rev = c.createGain();
            this.rev.gain.value = 0.28;
            const lp = c.createBiquadFilter();
            lp.type = "lowpass";
            lp.frequency.value = 3200;
            this.rev.connect(lp);
            lp.connect(conv);
            conv.connect(this.master);
            this.musicBus = c.createGain();
            this.musicBus.gain.value = this.musicOn ? 0.5 * this.musicVol / 0.6 : 0;
            this.musicBus.connect(this.master);
            const mrev = c.createGain();
            mrev.gain.value = 0.35;
            this.musicBus.connect(mrev);
            mrev.connect(this.rev);
            const nl = c.sampleRate * 2;
            this.noiseBuf = c.createBuffer(1, nl, c.sampleRate);
            const nd = this.noiseBuf.getChannelData(0);
            for (let i = 0; i < nl; i++)
                nd[i] = Math.random() * 2 - 1;
            this.startAmbience();
            this.startDrone();
            this.nextNote = c.currentTime + 1.2;
        }
        catch (e) {
            this.ctx = null;
        }
    }
    toggleMusic() {
        this.musicOn = !this.musicOn;
        if (this.ctx)
            this.musicBus.gain.setTargetAtTime(this.musicOn ? 0.5 * this.musicVol / 0.6 : 0, this.ctx.currentTime, 0.3);
        return this.musicOn;
    }
    spatial(x, cam) {
        const dx = x - (cam.x + W / 2);
        return { v: clamp(1 - Math.abs(dx) / 520, 0.12, 1), pan: clamp(dx / 300, -0.9, 0.9) };
    }
    ok(name, gapMs) {
        if (!this.ctx)
            return false;
        const now = performance.now();
        if (this.last[name] && now - this.last[name] < gapMs)
            return false;
        this.last[name] = now;
        return true;
    }
    // wyjście z panoramą i wysyłką na pogłos
    out(pan, wet = 0.3) {
        const c = this.ctx;
        const p = c.createStereoPanner();
        p.pan.value = clamp(pan, -1, 1);
        p.connect(this.fx);
        if (wet > 0) {
            const s = c.createGain();
            s.gain.value = wet;
            p.connect(s);
            s.connect(this.rev);
        }
        return p;
    }
    env(g, peak, dur, at = 0, attack = 0.003) {
        const t = this.ctx.currentTime + at;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    }
    noise(dest, dur, f0, f1, q, peak, type = "bandpass", at = 0) {
        const c = this.ctx, t = c.currentTime + at;
        const s = c.createBufferSource();
        s.buffer = this.noiseBuf;
        const f = c.createBiquadFilter();
        f.type = type;
        f.Q.value = q;
        f.frequency.setValueAtTime(f0, t);
        f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
        const g = c.createGain();
        this.env(g, peak, dur, at);
        s.connect(f);
        f.connect(g);
        g.connect(dest);
        s.start(t, Math.random() * 1.5);
        s.stop(t + dur + 0.05);
    }
    tone(dest, f0, f1, dur, type, peak, at = 0, attack = 0.003) {
        const c = this.ctx, t = c.currentTime + at;
        const o = c.createOscillator();
        o.type = type;
        o.frequency.setValueAtTime(f0, t);
        o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
        const g = c.createGain();
        this.env(g, peak, dur, at, attack);
        o.connect(g);
        g.connect(dest);
        o.start(t);
        o.stop(t + dur + 0.05);
    }
    crunch(dest, dur, peak, freq) {
        const c = this.ctx, t = c.currentTime;
        const s = c.createBufferSource();
        s.buffer = this.noiseBuf;
        const ws = c.createWaveShaper();
        const curve = new Float32Array(256);
        for (let i = 0; i < 256; i++) {
            const x = i / 128 - 1;
            curve[i] = Math.tanh(x * 6);
        }
        ws.curve = curve;
        const f = c.createBiquadFilter();
        f.type = "bandpass";
        f.frequency.value = freq;
        f.Q.value = 1.2;
        const g = c.createGain();
        this.env(g, peak, dur);
        s.connect(ws);
        ws.connect(f);
        f.connect(g);
        g.connect(dest);
        s.start(t, Math.random());
        s.stop(t + dur + 0.05);
    }
    // ---- Efekty walki ----
    swing(v = 1, pan = 0, weight = 1) {
        if (!this.ok("swing", 35))
            return;
        const o = this.out(pan, 0.1);
        const c = this.ctx, t = c.currentTime, dur = 0.16 + weight * 0.08;
        const s = c.createBufferSource();
        s.buffer = this.noiseBuf;
        const f = c.createBiquadFilter();
        f.type = "bandpass";
        f.Q.value = 1.6;
        f.frequency.setValueAtTime(350 / weight, t);
        f.frequency.exponentialRampToValueAtTime(1900 / weight, t + dur * 0.55);
        f.frequency.exponentialRampToValueAtTime(500 / weight, t + dur);
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.32 * v, t + dur * 0.5);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f);
        f.connect(g);
        g.connect(o);
        s.start(t, Math.random());
        s.stop(t + dur + 0.05);
    }
    // Trafienie w ciało. heavy: zamach z góry, wzmocniony cios albo obuch.
    hit(v = 1, pan = 0, type = "cut", heavy = false) {
        if (!this.ok("hit", 25))
            return;
        const o = this.out(pan, 0.22);
        const k = heavy ? 1.35 : 1;
        this.tone(o, 95 * (heavy ? 0.8 : 1), 38, heavy ? 0.32 : 0.2, "sine", 0.95 * v * k); // uderzenie w dół
        this.tone(o, 240, 90, 0.07, "triangle", 0.35 * v); // stuk
        this.noise(o, 0.12, 1600, 350, 0.9, 0.55 * v * k, "lowpass"); // mięso
        if (type === "cut")
            this.noise(o, 0.06, 3800, 2200, 2.5, 0.28 * v, "bandpass"); // cięcie
        if (type === "pierce")
            this.noise(o, 0.05, 2600, 900, 3, 0.25 * v, "bandpass");
        if (type === "blunt" || heavy)
            this.crunch(o, heavy ? 0.22 : 0.14, 0.4 * v, 700);
    }
    bone(v = 1, pan = 0, heavy = false) {
        if (!this.ok("bone", 25))
            return;
        const o = this.out(pan, 0.25);
        for (let i = 0; i < (heavy ? 5 : 3); i++)
            this.noise(o, 0.03, rr(2200, 3600), 1500, 6, 0.5 * v, "bandpass", i * rr(0.012, 0.025));
        this.tone(o, 520, 300, 0.07, "square", 0.07 * v);
        this.tone(o, 120, 50, 0.14, "sine", (heavy ? 0.8 : 0.5) * v);
        if (heavy)
            this.crunch(o, 0.18, 0.45 * v, 1800);
    }
    // Metal o metal: składowe nieharmoniczne jak w dzwonie.
    clang(v = 1, pan = 0, pitch = 1) {
        if (!this.ok("clang", 30))
            return;
        const o = this.out(pan, 0.5);
        const b = rr(560, 760) * pitch;
        const partials = [[1, 0.9, 0.28], [2.32, 0.6, 0.18], [4.25, 0.4, 0.1], [6.63, 0.25, 0.07], [9.1, 0.15, 0.04]];
        for (const [r, d, gk] of partials)
            this.tone(o, b * r, b * r * 0.995, d, "sine", gk * v);
        this.noise(o, 0.05, 6500, 4000, 1, 0.45 * v, "highpass");
        this.tone(o, 160, 70, 0.08, "sine", 0.4 * v);
    }
    parry() {
        if (!this.ctx)
            return;
        this.last.clang = 0;
        this.clang(1.25, 0, 1.35);
        const o = this.out(0, 0.6);
        this.tone(o, 2900, 2850, 0.9, "sine", 0.12);
        this.noise(o, 0.12, 8000, 5000, 1, 0.35, "highpass");
    }
    thunk(v = 1, pan = 0) {
        if (!this.ok("thunk", 25))
            return;
        const o = this.out(pan, 0.2);
        this.tone(o, 190, 110, 0.14, "triangle", 0.5 * v);
        this.tone(o, 85, 45, 0.18, "sine", 0.6 * v);
        this.noise(o, 0.09, 700, 400, 2, 0.4 * v, "bandpass");
    }
    kick() {
        if (!this.ok("kick", 40))
            return;
        const o = this.out(0, 0.15);
        this.tone(o, 110, 38, 0.18, "sine", 1);
        this.noise(o, 0.1, 600, 150, 1, 0.5, "lowpass");
        this.noise(o, 0.05, 1500, 700, 1, 0.2, "bandpass");
    }
    bow(v = 1, pan = 0) {
        if (!this.ok("bow", 25))
            return;
        const o = this.out(pan, 0.15);
        this.tone(o, 300, 230, 0.22, "triangle", 0.25 * v);
        this.tone(o, 150, 120, 0.12, "sine", 0.25 * v);
        this.noise(o, 0.07, 3200, 1200, 2, 0.15 * v, "bandpass");
    }
    arrowHit(v = 1, pan = 0) {
        if (!this.ok("arrow", 25))
            return;
        const o = this.out(pan, 0.15);
        this.noise(o, 0.04, 3000, 1500, 2, 0.3 * v, "bandpass");
        this.tone(o, 130, 60, 0.08, "sine", 0.35 * v);
    }
    death(v = 1, pan = 0, undead = false) {
        if (!this.ok("death", 90))
            return;
        const o = this.out(pan, 0.35);
        if (undead) {
            for (let i = 0; i < 7; i++)
                this.noise(o, 0.025, rr(1800, 3400), 1200, 6, 0.35 * v, "bandpass", i * rr(0.02, 0.05));
            this.tone(o, 90, 40, 0.3, "sine", 0.35 * v, 0.1);
            return;
        }
        const c = this.ctx, t = c.currentTime;
        const osc = c.createOscillator();
        osc.type = "sawtooth";
        const f0 = rr(150, 210);
        osc.frequency.setValueAtTime(f0, t);
        osc.frequency.linearRampToValueAtTime(f0 * 1.1, t + 0.1);
        osc.frequency.exponentialRampToValueAtTime(f0 * 0.45, t + 0.7);
        const bp = c.createBiquadFilter();
        bp.type = "bandpass";
        bp.frequency.value = rr(650, 900);
        bp.Q.value = 4;
        const g = c.createGain();
        this.env(g, 0.13 * v, 0.75, 0, 0.04);
        osc.connect(bp);
        bp.connect(g);
        g.connect(o);
        osc.start(t);
        osc.stop(t + 0.8);
        this.tone(o, 80, 40, 0.3, "sine", 0.5 * v, 0.25); // upadek
        this.noise(o, 0.2, 500, 200, 1, 0.3 * v, "lowpass", 0.25);
    }
    shout(v = 1) {
        if (!this.ok("shout", 350))
            return;
        const c = this.ctx, t = c.currentTime;
        const o = this.out(0, 0.4);
        for (let i = 0; i < 6; i++) {
            const osc = c.createOscillator();
            osc.type = "sawtooth";
            const f0 = rr(105, 175), d = i * 0.025;
            osc.frequency.setValueAtTime(f0, t + d);
            osc.frequency.linearRampToValueAtTime(f0 * 1.4, t + d + 0.22);
            osc.frequency.linearRampToValueAtTime(f0 * 1.15, t + d + 0.75);
            const bp = c.createBiquadFilter();
            bp.type = "bandpass";
            bp.frequency.value = rr(550, 950);
            bp.Q.value = 3.5;
            const g = c.createGain();
            g.gain.setValueAtTime(0.0001, t + d);
            g.gain.exponentialRampToValueAtTime(0.045 * v, t + d + 0.08);
            g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.85);
            osc.connect(bp);
            bp.connect(g);
            g.connect(o);
            osc.start(t + d);
            osc.stop(t + d + 0.9);
        }
    }
    wail() {
        if (!this.ctx)
            return;
        const o = this.out(0, 0.8);
        this.tone(o, 460, 95, 1.9, "sawtooth", 0.06, 0, 0.3);
        this.tone(o, 690, 140, 1.7, "sine", 0.08, 0.1, 0.3);
        this.tone(o, 55, 40, 2.0, "sine", 0.35, 0, 0.2);
    }
    ui() { if (!this.ok("ui", 40))
        return; const o = this.out(0, 0.05); this.tone(o, 900, 700, 0.05, "square", 0.04); }
    // Głos: krótki samogłoskowy dźwięk przez dwa formanty.
    voice(dest, f0, f1, dur, peak, formants, at = 0) {
        const c = this.ctx, t = c.currentTime + at;
        const o = c.createOscillator();
        o.type = "sawtooth";
        o.frequency.setValueAtTime(f0, t);
        o.frequency.exponentialRampToValueAtTime(f1, t + dur);
        const mix = c.createGain();
        mix.gain.value = 1;
        for (const fq of formants) {
            const bp = c.createBiquadFilter();
            bp.type = "bandpass";
            bp.frequency.value = fq;
            bp.Q.value = 5;
            o.connect(bp);
            bp.connect(mix);
        }
        const g = c.createGain();
        this.env(g, peak, dur, at, 0.02);
        mix.connect(g);
        g.connect(dest);
        o.start(t);
        o.stop(t + dur + 0.05);
    }
    pain(v = 1, pan = 0) {
        if (!this.ok("pain", 140))
            return;
        const o = this.out(pan, 0.25);
        const f = rr(120, 190);
        this.voice(o, f * 1.15, f * 0.8, rr(0.18, 0.3), 0.18 * v, [rr(500, 750), rr(1000, 1300)]);
    }
    scream(v = 1, pan = 0) {
        if (!this.ok("scream", 200))
            return;
        const o = this.out(pan, 0.4);
        const f = rr(170, 240);
        this.voice(o, f, f * 0.5, rr(0.5, 0.8), 0.16 * v, [rr(650, 850), rr(1100, 1400)]);
    }
    battleCry(v = 1) {
        if (!this.ok("cry", 900))
            return;
        const o = this.out(0, 0.5);
        for (let i = 0; i < 9; i++) {
            const f = rr(100, 170), d = rr(0, 0.25);
            this.voice(o, f, f * rr(1.1, 1.35), rr(0.8, 1.3), 0.05 * v, [rr(600, 800), rr(1050, 1250)], d);
        }
        this.tone(o, 70, 50, 0.6, "sine", 0.2 * v);
    }
    moan(v = 1, pan = 0) {
        if (!this.ok("moan", 700))
            return;
        const o = this.out(pan, 0.6);
        const f = rr(70, 110);
        this.voice(o, f, f * 0.7, rr(1, 1.6), 0.09 * v, [rr(300, 450), rr(700, 900)]);
    }
    step(v = 1, heavy = 1) {
        if (!this.ok("step", 90))
            return;
        const o = this.out(0, 0.05);
        this.tone(o, 90 * heavy, 50, 0.08, "sine", 0.18 * v);
        this.noise(o, 0.06, 900, 300, 1, 0.07 * v, "lowpass");
        if (chance(0.6))
            this.noise(o, 0.05, 6000, 4000, 4, 0.025 * v, "bandpass", 0.01); // brzęk kolczugi
    }
    hoof(v = 1, pan = 0) {
        if (!this.ok("hoof", 55))
            return;
        const o = this.out(pan, 0.1);
        this.tone(o, 140, 60, 0.07, "sine", 0.3 * v);
        this.noise(o, 0.05, 1200, 500, 2, 0.12 * v, "bandpass");
    }
    neigh(v = 1, pan = 0) {
        if (!this.ok("neigh", 1500))
            return;
        const o = this.out(pan, 0.5);
        const c = this.ctx, t = c.currentTime;
        const osc = c.createOscillator();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(700, t);
        osc.frequency.linearRampToValueAtTime(950, t + 0.15);
        osc.frequency.linearRampToValueAtTime(500, t + 0.8);
        const lfo = c.createOscillator();
        lfo.frequency.value = 22;
        const lg = c.createGain();
        lg.gain.value = 60;
        lfo.connect(lg);
        lg.connect(osc.frequency);
        const bp = c.createBiquadFilter();
        bp.type = "bandpass";
        bp.frequency.value = 1500;
        bp.Q.value = 2;
        const g = c.createGain();
        this.env(g, 0.08 * v, 0.85, 0, 0.03);
        osc.connect(bp);
        bp.connect(g);
        g.connect(o);
        osc.start(t);
        lfo.start(t);
        osc.stop(t + 0.9);
        lfo.stop(t + 0.9);
    }
    trample(v = 1, pan = 0) {
        if (!this.ok("trample", 60))
            return;
        const o = this.out(pan, 0.3);
        this.tone(o, 80, 30, 0.35, "sine", 0.9 * v);
        this.crunch(o, 0.2, 0.35 * v, 500);
    }
    // ---- Tło ----
    startAmbience() {
        const c = this.ctx;
        const wind = c.createBufferSource();
        wind.buffer = this.noiseBuf;
        wind.loop = true;
        const wf = c.createBiquadFilter();
        wf.type = "lowpass";
        wf.frequency.value = 420;
        const wg = c.createGain();
        wg.gain.value = 0.06;
        const lfo = c.createOscillator();
        lfo.frequency.value = 0.07;
        const lg = c.createGain();
        lg.gain.value = 0.035;
        lfo.connect(lg);
        lg.connect(wg.gain);
        const lfo2 = c.createOscillator();
        lfo2.frequency.value = 0.11;
        const lg2 = c.createGain();
        lg2.gain.value = 180;
        lfo2.connect(lg2);
        lg2.connect(wf.frequency);
        wind.connect(wf);
        wf.connect(wg);
        wg.connect(this.master);
        wind.start();

    }
    setVolume(v) { this.volume = v; if (this.ctx)

    tick(dt, intensity, rain = false) {

                this.noteStep = 0;

            this.nextNote += beat * (long ? 3 : chance(0.15) ? 0.5 : 1);
        }
    }

    // Pod górę wolniej, z górki trochę szybciej.
    slope(u, tx, ty) {
        if (!this.map.hills.length)
            return 1;
        const a = Math.atan2(ty - u.y, tx - u.x);
        const dh = this.height(u.x + Math.cos(a) * 10, u.y + Math.sin(a) * 10) - this.height(u.x, u.y);
        return clamp(1 - dh * 5, 0.65, 1.12);
    }
    // Opuszczona kopia: trafia wszystko na drodze konia, siła rośnie z prędkością.
    lanceCheck(u) {
        if (!u.mounted || u.weaponKey !== "lance") {
            u.couched = false;
            return;
        }
        if (!u.hero)
            u.couched = u.rspeed > u.maxRide * 0.7 && !!u.target && u.target.active && dist(u.x, u.y, u.target.x, u.target.y) < 90 && Math.abs(angDiff(u.heading, Math.atan2(u.target.y - u.y, u.target.x - u.x))) < 0.5;
        if (!u.couched || u.couchCd > 0 || u.rspeed < u.maxRide * 0.5)
            return;
        for (const e of this.units) {
            if (e.team === u.team || !e.active)
                continue;
            const d = dist(u.x, u.y, e.x, e.y);
            if (d > 30 + e.radius || d < 4)
                continue;
            if (Math.abs(angDiff(u.heading, Math.atan2(e.y - u.y, e.x - u.x))) > 0.32)
                continue;
            const k = u.rspeed / u.maxRide;
            const dmg = (28 + 60 * k) * e.arm.pierce * (u.hero ? this.heroDmg : 1) * (this.cfg.arena && !this.cfg.arena.lethal ? 0.55 : 1);
            u.couchCd = 0.7;
            u.rspeed *= 0.55;

            this.sfx.hit(s.v, s.pan, "pierce", true);
            this.sfx.trample(s.v * 0.6, s.pan);

                    this.push(e, u.x, u.y, 140);

            if (u.hero || e.hero) {

            ord[wallK] = { ...newOrder(W2.x0 + 18, W2.gateY, "line"), face: Math.PI, spacing: 1.9 };

                ord[5].ay = W2.gateY;

    // Fale posiłków: gdy na polu robi się luźno, z rezerwy wchodzi kolejna grupa przy krawędzi swojej strony.

    slotsFor(n, ax, ay, face, f, colsOverride, spacing = 1, mounted = false) {

            const off = this.units.find((u) => u.team === 0 && u.squad === sq && u.officer && u.active);
            const o = this.ensureOrder(sq);
            if (!off) {
                o.mode = "charge";
                continue;
            }
            const c = this.centroid(0, sq);
            let near = 1e9;
            for (const e of this.units)
                if (e.team === 1 && e.active && !e.hidden)
                    near = Math.min(near, dist(c.x, c.y, e.x, e.y));
            const list = this.squadUnits(sq);
            if (this.cfg.terrain === "siege" && this.cfg.siegeDefender === 1) {
                o.mode = "charge";
                continue;
            }
            if (this.time > 90 && near > 200) {
                o.mode = "charge";
                continue;
            }
            if (list.some((u) => u.def.bow)) {
                const ammo = list.reduce((s, u) => s + u.ammo, 0);
                if (ammo === 0) {
                    o.mode = "charge";
                    o.meleeOnly = true;
                }
                else if (near < 55 && o.mode !== "charge")
                    this.orderRetreat([sq]);
                else if (o.mode !== "hold") {
                    o.mode = "hold";
                    o.ax = c.x;
                    o.ay = c.y;
                    o.face = undefined;
                }
            }
            else {
                if (near < 120)
                    o.mode = "charge";
                else if (o.mode === "charge" && near > 220) {

                    o.ay = c.y;

        if (!siege && (this.time > 110 || (this.time > 25 && mineN > foeN * 2.5))) {

            }

        if (this.regroupT && this.time > this.regroupT && team === 1) {

            if (o)

                    p.z = 0;
                    p.vz = Math.abs(p.vz) > 40 ? -p.vz * 0.35 : 0;
                    p.vx *= 0.5;
                    p.vy *= 0.5;
                    if (Math.abs(p.vz) < 1) {

                    }
                    this.dg.fillStyle = PAL.blood;
                    this.dg.fillRect(Math.round(p.x), Math.round(p.y), 2, 1);
                }
                if (p.life < 0.1 && p.z <= 0) { // zostaje na ziemi jako ślad

                    else {

function iconUrl(name) {
    let u = ICON_URL.get(name);
    if (u)
        return u;
    const art = ICON_ART[name] || ICON_ART.star;
    const P = new Pix(9, 9);
    art[1].forEach((row, y) => { for (let x = 0; x < 9; x++)
        if (row[x] === "x")
            P.p(x, y, art[0]); });
    u = P.toCanvas(true, true).toDataURL();
    ICON_URL.set(name, u);
    return u;
}
function ic(name, cls = "") { return `<img class="ic ${cls}" src="${iconUrl(name)}" alt="">`; }
// ---------- Podgląd jednostki: postać z koniem, przód i bok ----------
const UPREV = new Map();
function unitCanvas(key, dir = 0, frame = 0, faction, look) {
    const def = UNITS[key];
    const fac = faction ?? (FACTION_OF_CULTURE[def.culture] || (def.culture === "merc" ? 9 : def.culture === "monster" ? 7 : 6));
    const ck = [key, dir, frame, fac, look ? look.seed : ""].join(":");
    let c = UPREV.get(ck);
    if (c)
        return c;
    if (def.mount && dir === 0)
        dir = 2; // jeźdźca lepiej widać z boku
    const L = look || troopLook(def, 7, fac);
    const spr = spritesFor(L, look ? "prev:" + key + L.seed : `${key}:${fac}:7`);
    const img = spr.frames[dir][frame];
    if (def.mount) {
        const F = FACTIONS[fac] || FACTIONS[6];
        const hs = getHorse(7, [F.col, F.shade, F.trim], !!def.mount.undead);
        const himg = hs.frames[dir][frame];
        const [cv, g] = mkCanvas(40, 48);
        g.drawImage(himg, Math.round(20 - himg.width / 2), 48 - himg.height + 2);
        const riderY = dir === 2 ? -11 : -9;
        g.drawImage(img, 0, 0, img.width, Math.round(img.height * 0.66), Math.round(20 - img.width / 2), 48 - img.height + riderY, img.width, Math.round(img.height * 0.66));
        c = cv;
    }
    else {
        const [cv, g] = mkCanvas(32, 40);
        g.drawImage(img, 4, 6);
        c = cv;
    }
    UPREV.set(ck, c);
    return c;
}

// Pisanie tekstu w dymku litera po literze.
function typeBubble() {
    const b = document.getElementById("bubble");
    if (!b)
        return;
    const full = b.dataset.full || "";
    let i = 0;
    const step = () => { if (!document.body.contains(b))
        return; i = Math.min(full.length, i + 2); b.textContent = full.slice(0, i); if (i < full.length)
        setTimeout(step, 14); };
    step();

          ${s.siegeBy.length ? `<p class="bad">Miasto jest oblężone!</p>` : ""}`,
                acts: { talkLord: (v) => showLordTalk(lordById(w, Number(v)), () => renderSettlement()) },

        case "recruit": {

            const cost = (u) => UNITS[u].tier >= 2 ? Math.round(UNITS[u].cost * 1.3) : UNITS[u].cost;

                        return; P.gold -= n * c; s.recruits -= n; addTroops(p.troops, u, n); sfx.coin(); re(); },

            };
        }
        case "market": {
            const keys = s.kind === "village" ? FOOD_KEYS : GOOD_KEYS;

                html: `<table class="tbl"><tr><th>Towar</th><th>Zapas</th><th>Kupno</th><th>Sprzedaż</th><th>Masz</th><th></th></tr>
        ${keys.map((k) => `<tr><td>${GOODS[k].name}${GOODS[k].food ? " <span class='muted'>(żywność)</span>" : ""}</td><td>${Math.floor(s.stock[k])}</td><td>${buyPrice(w, s, k)}</td><td>${sellPrice(w, s, k)}</td><td>${P.goods[k] || 0}</td>
          <td><button class="mini" data-a="buy" data-v="${k}:1">Kup</button><button class="mini" data-a="buy" data-v="${k}:5">×5</button><button class="mini" data-a="sell" data-v="${k}:1" ${(P.goods[k] || 0) > 0 ? "" : "disabled"}>Sprzedaj</button><button class="mini" data-a="sell" data-v="${k}:all" ${(P.goods[k] || 0) > 0 ? "" : "disabled"}>Wszystko</button></td></tr>`).join("")}</table>
        <p class="tip">Ceny zależą od zapasów. Karawany i wojna je zmieniają. Kupuj tam, gdzie towaru jest dużo, sprzedawaj tam, gdzie go brak.</p>`,
                acts: {
                    buy: (v) => { const [k, ns] = v.split(":"); let n = Number(ns); for (let i = 0; i < n; i++) {

          ${P.equip.bow ? `<tr><td>Kołczan strzał<br><span class="muted">uzupełnia do 40</span></td><td>25</td><td><button class="mini" data-a="ammo" ${P.gold >= 25 ? "" : "disabled"}>Kup</button></td></tr>` : ""}</table></div>
          <div><h2>Twój dobytek</h2>${P.items.length ? `<table class="tbl">${P.items.map((id, i) => { const it = ITEMS[id]; return `<tr><td>${itemName(it)}<br><span class="muted">${SLOT_NAME[it.slot]} · ${itemStat(it)}</span></td><td>${itemPrice(it, false, P.skills.trade)}</td><td><button class="mini" data-a="sellI" data-v="${i}">Sprzedaj</button></td></tr>`; }).join("")}</table>` : "<p class='muted'>Nic w jukach. Zakładany sprzęt zmieniasz w oknie Ekwipunek (I).</p>"}</div></div>`,
                acts: {

        case "tavern": {

            return {
                html: `<div class="cols"><div>
          <h2>Najemnicy</h2>${mercN > 0 ? `<div class="row"><span>${mercN}× ${UNITS[mercType].name} · ${Math.round(UNITS[mercType].cost * 1.2)} za głowę</span><button class="mini" data-a="merc" data-v="${mercN}:${mercType}" ${room > 0 && P.gold >= UNITS[mercType].cost * 1.2 ? "" : "disabled"}>Najmij</button></div>` : "<p class='muted'>Dziś nikt nie szuka roboty.</p>"}
          <h2>Kompani</h2>${comps.length ? comps.map((id) => { const c = COMPANIONS.find((x) => x.id === id); const cs = makeCompanion(id); return `<div class="comp">${pic(drawPortrait(cs.look, PAL.bone), "portrait")}<div><b>${c.name}</b> <span class="muted">${c.role}</span><br><span class="tip">${c.bio}</span><br><button class="mini" data-a="hire" data-v="${id}" ${P.gold >= c.cost && P.companions.length < 3 ? "" : "disabled"}>Przyjmij (${c.cost}, żołd ${c.wage})</button></div></div>`; }).join("") : "<p class='muted'>Nikogo ciekawego.</p>"}
          ${P.companions.length >= 3 ? "<p class='tip'>Masz już trzech kompanów.</p>" : ""}
        </div><div>
          <h2>Plotki</h2><p class="tip">${rumor(s)}</p><p class="tip">${rumor(s, 7)}</p>
          <button class="mini" data-a="drink" ${P.gold >= 40 ? "" : "disabled"}>Postaw kolejkę ludziom (40)</button>
          <h2>Handlarz okupem</h2>${p.prisoners.length ? `<table class="tbl">${p.prisoners.map((t, i) => `<tr><td>${t.n}× ${UNITS[t.type].name}</td><td>${prisonerValue(t)}/szt.</td><td><button class="mini" data-a="sellP" data-v="${i}">Sprzedaj</button></td></tr>`).join("")}</table>` : "<p class='muted'>Nie masz jeńców.</p>"}
          ${captiveLords.length ? `<h2>Pojmani lordowie</h2>${captiveLords.map((l) => `<div class="row"><span>${l.title} ${l.name} (${factionShort(l.faction)})</span><span><button class="mini" data-a="ransom" data-v="${l.id}">Okup ${300 + Math.round(l.renown)}</button><button class="mini" data-a="free" data-v="${l.id}">Uwolnij</button></span></div>`).join("")}` : ""}
        </div></div>`,
                acts: {
                    merc: (v) => { const [ns, t] = v.split(":"); const pr = Math.round(UNITS[t].cost * 1.2); const n = Math.min(Number(ns), Math.floor(P.gold / pr), room); if (n <= 0)
                        return; P.gold -= n * pr; addTroops(p.troops, t, n); w.player["merc" + s.id + "_" + Math.floor(w.day / 4)] = (w.player["merc" + s.id + "_" + Math.floor(w.day / 4)] || 0) + n; sfx.coin(); re(); },

                    sellP: (v) => { const t = p.prisoners[Number(v)]; P.gold += prisonerValue(t) * t.n; p.prisoners.splice(Number(v), 1); sfx.coin(); re(); },
                    ransom: (v) => { const L = lordById(w, Number(v)); P.gold += 300 + Math.round(L.renown); L.captive = -1; L.relation -= 5; chron(w, `${L.title} ${L.name} wykupiony z niewoli u ${P.name}.`); sfx.coin(); re(); },
                    free: (v) => { const L = lordById(w, Number(v)); L.captive = -1; L.relation += 15; P.honor += 3; chron(w, `${P.name} wypuszcza z niewoli: ${L.title} ${L.name}. Szlachetny gest.`, PAL.moss); re(); },

        }
        case "arena": {

            return {
                html: `<p>Piasek areny, krzyk tłumu. Walczy się do nokautu, nikt tu nie ginie… zwykle.</p>
          ${row("duel", "Pojedynek", "jeden przeciwnik, broń jak twoja", "nagroda 40")}
          ${row("team3", "Drużyny 3 na 3", "ty i dwóch zawodników", "nagroda 70")}
          ${row("team5", "Drużyny 5 na 5", "większa przepychanka na piasku", "nagroda 110")}
          ${row("waves", "Fala za falą", "kolejni przeciwnicy wchodzą, gdy padają poprzedni", "nagroda 160")}
          ${row("joust", "Pojedynek na kopie", "konno, z kopią w galopie (R)", "nagroda 90")}
          ${row("death", "Walka na śmierć", "ciemny klub nocą: prawdziwa broń, przeciwnik ginie", "nagroda 300", 60)}
          ${tour ? `<h2>Turniej (${s.tournament} dni)</h2><p>Drabinka ośmiu zawodników: ćwierćfinał, półfinał (na kopie) i finał. Zwycięzca: 600 denarów i sława.</p>
            <div class="row"><span>Zakład na siebie: <input type="number" min="0" max="${P.gold}" step="10" value="${SET.bet}" data-in="bet" class="num"></span><button class="mini" data-a="tour">Wejdź do turnieju</button></div>` : "<p class='muted'>Turniej obecnie się nie odbywa. Ogłoszenia pojawiają się na mapie.</p>"}
          <p class="tip">Na arenie walczysz swoim sprzętem, ale bez armii i kompanów.</p>`,

                html: `${active.length ? `<h2>Twoje zadania tutaj</h2>${active.map((x) => `<p>${x.text} <span class="muted">(${x.days} dni)</span></p>`).join("")}` : ""}
          ${grainQ ? `<div class="row"><span>Masz ${P.goods.grain || 0} zboża.</span><button class="mini" data-a="giveGrain" ${(P.goods.grain || 0) >= grainQ.amount ? "" : "disabled"}>Oddaj ${grainQ.amount} zboża</button></div>` : ""}
          ${q && !active.length ? `<h2>Prośba</h2><p>${q.text}</p><p class="tip">Nagroda: ${q.reward} denarów · czas: ${q.days} dni</p><button class="mini" data-a="take">Przyjmij zadanie</button>` : !active.length ? "<p class='muted'>Nie mają dla ciebie roboty.</p>" : ""}`,
                acts: {

        }

            return {
                html: `<div class="cols"><div><h2>Twoja armia</h2>${troopTable(p.troops, "toG")}</div><div><h2>Załoga</h2>${troopTable(s.garrison, "fromG")}</div></div><p class="tip">Załoga broni murów, gdy cię nie ma. Nie płacisz za nią żołdu z sakwy, utrzymuje ją lenno.</p>`,
                acts: {
                    toG: (v) => { const [k, n] = v.split(":"); const t = p.troops.find((x) => x.type === k); const m = Math.min(n === "all" ? t.n - t.wounded : 1, t.n - t.wounded); if (m > 0) {

                html: `<p class="bad">${s.name} jest oblężone od ${s.siegeDays} dni przez: ${bes.map((o) => o.name).join(", ")} (${n} ludzi).</p>

          <div class="btns"><button data-a="defendNow">Broń murów!</button></div>`,
                acts: { defendNow: () => launchBattle({ kind: "siege", defend: true, enemies: bes, allies: [], garrisonAlly: s.garrison, settlement: s, title: `Obrona: ${s.name}` }, { siegeDefender: 0, engines: { ram: chance(0.7), tower: chance(0.4) } }) },

            return {
                html: `<p>${s.name} broni ${def} ludzi załogi${lordsInside.length ? ` i armie: ${lordsInside.map((l) => l.name).join(", ")}` : ""}.</p>

            <p class="tip">Każdy dzień oczekiwania posuwa budowę zaznaczonych machin. Bez taranu brama ledwo drgnie.</p>
            <div class="btns"><button data-a="assault" ${s.siegeDays >= 1 ? "" : "disabled"}>Szturm!</button><button class="alt" data-a="waitDay">Czekaj dzień</button><button class="alt" data-a="lift">Odstąp</button></div>`

                    eng: (k) => { SW().on[k] = !SW().on[k]; re(); },
                    waitDay: () => { closeScreen(); G.waitHours = 24; G.camping = true; p.state = "camp"; pendingAfterWait = () => { s.siegeDays = Math.max(s.siegeDays, 1); for (const e of ENGINES)

                        } enterSettlement(s); SET.tab = "siege"; renderSettlement(); }; },
                    lift: () => { s.siegeBy = s.siegeBy.filter((id) => id !== p.id); p.siege = undefined; P.siegeWork = null; closeScreen(); },

                        const enemies = lordsInside;

                    },

const ENGINES = [
    { k: "ram", name: "Taran", days: 1, desc: "Pchany pod bramę, rozbija ją w kilka uderzeń." },
    { k: "tower", name: "Wieża oblężnicza", days: 2, desc: "Podjeżdża pod mur i opuszcza pomost." },
    { k: "treb", name: "Trebusz", days: 2, desc: "Głazy rozbijają obrońców na murach i bramę." },
];
// Postęp budowy machin dla bieżącego oblężenia gracza.
function SW() {
    const P = WORLD.player, sid = SET.id;
    if (!P.siegeWork || P.siegeWork.sid !== sid)
        P.siegeWork = { sid, q: { ram: 0, tower: 0, treb: 0 }, on: {} };

                yes: () => { playerDeclareWar(w, o.faction); launchBattle({ kind: "field", enemies: [o, ...nearbyEnemyHelpers(w, o)], allies: nearbyAllies(w, o), title: o.name }); },
                no: () => meetParty(o, false),
            }, "dialog-scr");
        },
        surrender: () => {
            const lines = [];
            for (const t of o.troops)
                addTroops(p.prisoners, t.type, Math.floor(t.n * 0.6));
            P.gold += o.gold;
            P.renown += 5;
            lines.push(`${o.name} składa broń. Bierzesz jeńców i ${o.gold} denarów.`);

        },
    };

            ch.push({ a: "pay", label: `Weźcie ${Math.round(P.gold * 0.25)} denarów i odejdźcie.` });
        if (ambushed) {
            ch.push({ a: "flee", label: "Uciekamy! (próba ucieczki)" });
            if (troopCount(p.troops) > 3)
                ch.push({ a: "rear", label: "Zostawiam straż tylną, reszta za mną." });
        }
        else
            ch.push({ a: "leave", label: "Odejdź" });
    }
    else {

            ch.push({ a: "talk", label: "Chcę z tobą pomówić." });
        ch.push({ a: "attackNeutral", label: "Napadnij na nich", cls: "danger" });

    const info = `<div class="comp-row">${comp}</div>
    ${host ? `<div class="pow"><span>Ty ${Math.round(myPow)}</span><div class="powbar"><i style="width:${ratio * 100}%"></i></div><span>${Math.round(theirPow)} Wróg</span></div><p class="tip">${strengthWord(myPow / Math.max(0.1, theirPow))}</p>` : ""}
    ${helpers.length ? `<p class="bad">Na pomoc idą: ${helpers.map((h) => h.name).join(", ")}.</p>` : ""}
    ${allies.length ? `<p class="gold">Sojusznicy w pobliżu: ${allies.map((h) => h.name).join(", ")}.</p>` : ""}`;
    showScr(`<div class="dialog frame">${dialogHtml({ left: playerPortrait(), right: portrait, title: esc(o.name), sub: `${factionName(o.faction)} · ${troopCount(o.troops)} ludzi`, speech: greet.replace(/<[^>]+>/g, ""), info, choices: ch })}</div>`, acts, "dialog-scr");

function showLordTalk(L, back) {
    const w = WORLD, P = w.player;
    const F = w.factions[L.faction];
    const portrait = drawPortrait(L.look, factionCol(L.faction)[0]);
    const relWord = L.relation > 30 ? "przyjazny" : L.relation > 5 ? "życzliwy" : L.relation > -10 ? "obojętny" : L.relation > -30 ? "chłodny" : "wrogi";
    const wars = Object.keys(F.war).filter((k) => F.war[Number(k)]).map(Number);

        } P.liege = L.faction; P.status = "najemnik"; P.contractDays = 30; chron(w, `${P.name} zaciąga się jako najemnik: ${factionName(L.faction)}.`, PAL.gold); toast(`Kontrakt na 30 dni. Wrogowie: ${wars.map(factionShort).join(", ")}.`, PAL.gold); refreshMapHud(); showLordTalk(L, back); };
    }
    if (L.ruler && P.status !== "król" && P.liege !== L.faction || (L.ruler && P.status === "najemnik" && P.liege === L.faction)) {
        opts.push(`<button class="alt" data-a="vassal">Chcę złożyć przysięgę wasalną</button>`);
        acts.vassal = () => {
            if (P.renown < 120) {
                say(`„Kim ty jesteś? Wróć, gdy twoje imię będzie coś znaczyć.” (sława ${P.renown}/120)`);
                return;
            }
            if (L.relation < -5) {
                say("„Nie ufam ci.”");
                return;
            }
            if (playerAtWarWith(w, L.faction) && P.liege !== L.faction) {
                say("„Najpierw przestań mordować moich ludzi.”");
                return;
            }
            if (P.liege > 0 && P.liege !== L.faction)
                leaveLiege(w, false);
            P.liege = L.faction;
            P.status = "wasal";
            P.wars = [];
            const fief = w.settlements.find((s) => s.faction === L.faction && s.kind === "village" && s.owner !== -2) || null;
            if (fief) {
                fief.owner = -2;
            }
            chron(w, `${P.name} składa przysięgę: ${L.title} ${L.name}, ${factionName(L.faction)}.`, PAL.gold);
            say(`„Powstań, ${P.name}. Od dziś służysz koronie.${fief ? ` Na utrzymanie dostajesz ${fief.name}.` : ""}”`);
            L.relation += 10;
            refreshMapHud();
        };
    }
    if (L.ruler && P.liege === L.faction && P.status === "wasal") {
        opts.push(`<button class="alt" data-a="unvassal">Zwolnij mnie z przysięgi</button>`);
        acts.unvassal = () => { leaveLiege(w, false); L.relation -= 15; chron(w, `${P.name} zrzeka się przysięgi wobec ${factionName(L.faction)}.`); say("„Idź więc. Ale nie wracaj z mieczem.”"); refreshMapHud(); };
    }
    if (L.ruler && playerAtWarWith(w, L.faction) && (P.status === "król" || P.liege === 0) && L.faction !== 5) {
        const price = 400 + Math.round(P.renown);
        opts.push(`<button class="alt" data-a="peace">Zaproponuj pokój (${price} denarów)</button>`);
        acts.peace = () => {
            if (P.gold < price) {
                say("„Pokój kosztuje. Nie masz tyle.”");
                return;
            }
            if (L.relation < -40 && chance(0.6)) {
                say("„Prędzej zgniję, niż podam ci rękę.”");
                return;
            }
            P.gold -= price;
            if (P.status === "król")
                setWar(w, PLAYER_FACTION, L.faction, false);
            else {
                P.wars = P.wars.filter((f) => f !== L.faction);
                chron(w, `${P.name} zawiera pokój z ${factionName(L.faction)}.`, PAL.moss);
            }
            L.relation += 10;
            say("„Niech będzie. Na razie.”");
            refreshMapHud();
        };
    }
    if (P.status === "król" && !L.ruler && L.faction !== PLAYER_FACTION && L.faction !== 5) {
        opts.push(`<button class="alt" data-a="defect">Przyłącz się do mojego królestwa</button>`);
        acts.defect = () => {
            const chanceOk = (L.relation - 20) / 60 + (L.personality === "chciwy" ? 0.2 : L.personality === "honorowy" ? -0.3 : 0) + P.renown / 2000;
            if (L.relation < 20 || !chance(clamp(chanceOk, 0.05, 0.85))) {
                say("„Nie zdradzę swego władcy.”");
                L.relation -= 3;
                return;
            }
            const old = L.faction;
            L.faction = PLAYER_FACTION;
            const party = partyById(w, L.party);
            if (party)
                party.faction = PLAYER_FACTION;
            for (const s of w.settlements)
                if (s.owner === L.id)
                    captureSettlement(w, s, PLAYER_FACTION, L.id);
            chron(w, `${L.title} ${L.name} porzuca ${factionName(old)} i przysięga wierność: ${P.kingdom}!`, PAL.gold);
            say("„Twoja sprawa jest i moją sprawą, panie.”");
        };
    }
    if (!playerAtWarWith(w, L.faction)) {
        opts.push(`<button class="alt" data-a="gift">Podaruj 200 denarów</button>`);
        acts.gift = () => { if (P.gold < 200)
            return; P.gold -= 200; L.relation += L.personality === "chciwy" ? 8 : 4; say("„Hojność zostanie zapamiętana.”"); };
    }
    const line = L.personality === "okrutny" ? "„Mów szybko, nie lubię czekać.”" : L.personality === "chciwy" ? "„Co mi przynosisz?”" : L.personality === "ostrożny" ? "„Słucham. Ostrożnie dobieraj słowa.”" : "„Słucham cię.”";
    const ch = opts.map((h) => { const m = h.match(/data-a="([^"]+)"[^>]*>([^<]+)</); return { a: m[1], label: m[2] }; });
    ch.push({ a: "back", label: "Żegnaj." });
    const relBar = `<div class="pow rel"><span>Wrogość</span><div class="powbar"><i style="width:${clamp((L.relation + 100) / 2, 0, 100)}%"></i></div><span>Przyjaźń</span></div>`;
    const lp = partyById(w, L.party);
    const info = `${relBar}<p class="tip">${factionName(L.faction)}${L.ruler ? " · władca" : ""} · ${L.personality} · nastawienie ${relWord} (${L.relation})${lp ? ` · armia: ${troopCount(lp.troops)}` : ""} · sława ${L.renown}</p>`;
    showScr(`<div class="dialog frame">${dialogHtml({ left: playerPortrait(), right: portrait, title: `${L.title} ${L.name}`, speech: line, info, choices: ch })}</div>`, acts, "dialog-scr");
}

    <div><h2>Straty wroga</h2>${cas(r.theirs)}</div></div>
    ${gold || items.length ? `<h2>Łupy</h2><p>${gold ? `${gold} denarów` : ""}${items.length ? `${gold ? " · " : ""}${items.map((i) => ITEMS[i].name).join(", ")}` : ""}</p>` : ""}
    ${r.prisoners.length ? `<p>Jeńcy: ${r.prisoners.map((p) => `${p.n}× ${UNITS[p.type].name}`).join(", ")}</p>` : ""}
    ${promo}
    ${lines.map((l) => `<p>${l}</p>`).join("")}
    <div class="btns"><button data-a="next">Dalej</button>${ready.length ? `<button class="alt" data-a="army">Armia (awanse)</button>` : ""}</div></div>`, {
        army: () => { closeScreen(); G.state = "map"; showMapHud(); showParty(); },
        next: () => {
